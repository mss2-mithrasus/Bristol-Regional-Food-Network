{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register | Bristol Regional Food Network</title>
    <!-- Used for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <!-- Global CSS -->
    <link rel="stylesheet" href="{% static 'base.css' %}">
    <!-- Page-specific CSS -->
    <link rel="stylesheet" href="{% static 'registration_page.css' %}">
</head>
<body>

<header class="navbar">
    <div class="nav-left">
        <img src="{% static 'images/leaf.png' %}" alt="Leaf logo" class="logo">
        <span class="title">Bristol Regional Food Network</span>
    </div>

    <nav class="nav-links">
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'login' %}">Login</a>
        <a href="{% url 'register' %}" class="active">Register</a>
        <a href="{% url 'about' %}">About us</a>
    </nav>
</header>

<main>
    <div class="register-container">
        <h1>Welcome to the marketplace!</h1>
        <p>Choose the type of account you want to create.</p>

        <!-- ACCOUNT TYPE (Customer or Producer)-->
        <div class="account_type">
            <button type="button" class="type_btn active" id="customerBtn">Customer</button>
            <button type="button" class="type_btn" id="producerBtn">Producer</button>
        </div>

        <!-- CUSTOMER TYPE BUTTON is only visible when Customer is selected -->
        <div id="customerTypeSection">
            <p class="subheading">Choose type of customer:</p>
            <div class="customer_type">
                <button type="button" class="type_btn small active" id="custIndividualBtn">Customer</button>
                <button type="button" class="type_btn small" id="custCommunityBtn">Community Group</button>
                <button type="button" class="type_btn small" id="custRestaurantBtn">Restaurant</button>
            </div>
        </div>

        <!-- REGISTRATION FORM -->
        <form id="registerForm" class="register-form">
            
            <!-- CUSTOMER: NOEMAL CUSTOMER -->
            <div id="custIndividualFields">
                <div class="input_row">
                    <label>First Name:</label>
                    <input type="text" name="first_name">
                </div>
                <div class="input_row">
                    <label>Last Name:</label>
                    <input type="text" name="last_name">
                </div>
                <div class="input_row">
                    <label>Email:</label>
                    <input type="email" name="email">
                </div>
                <div class="input_row">
                    <label>Phone:</label>
                    <input type="text" name="phone">
                </div>
                <div class="input_row">
                    <label>Delivery Address:</label>
                    <input type="text" name="address_line">
                </div>
                <div class="input_row">
                    <label>Postcode:</label>
                    <input type="text" name="postcode">
                </div>
            </div>

            <!-- CUSTOMER: COMMUNITY GROUP -->
            <div id="custCommunityFields" style="display:none;">
                <div class="input_row">
                    <label>Organisation Name:</label>
                    <input type="text" name="organisation_name">
                </div>
                <div class="input_row">
                    <label>Organisation Status:</label>
                    <select name="organisation_status">
                        <option value="">Select...</option>
                        <option value="charity">Charity</option>
                        <option value="education">Education</option>
                    </select>
                </div>
                <div class="input_row">
                    <label>Email:</label>
                    <input type="email" name="email">
                </div>
                <div class="input_row">
                    <label>Phone:</label>
                    <input type="text" name="phone">
                </div>
                <div class="input_row">
                    <label>Delivery Address:</label>
                    <input type="text" name="address_line">
                </div>
                <div class="input_row">
                    <label>Postcode:</label>
                    <input type="text" name="postcode">
                </div>
            </div>

            <!-- CUSTOMER: RESTAURANT -->
            <div id="custRestaurantFields" style="display:none;">
                <div class="input_row">
                    <label>Organisation Name:</label>
                    <input type="text" name="organisation_name">
                </div>
                <div class="input_row">
                    <label>Email:</label>
                    <input type="email" name="email">
                </div>
                <div class="input_row">
                    <label>Phone:</label>
                    <input type="text" name="phone">
                </div>
                <div class="input_row">
                    <label>Delivery Address:</label>
                    <input type="text" name="address_line">
                </div>
                <div class="input_row">
                    <label>Postcode:</label>
                    <input type="text" name="postcode">
                </div>
            </div>

            <!-- PRODUCER FIELDS -->
            <div id="producerFields" style="display:none;">
                <div class="input_row">
                    <label>Business Name:</label>
                    <input type="text" name="business_name">
                </div>
                <div class="input_row">
                    <label>Contact First Name:</label>
                    <input type="text" name="contact_first_name">
                </div>
                <div class="input_row">
                    <label>Contact Last Name:</label>
                    <input type="text" name="contact_last_name">
                </div>
                <div class="input_row">
                    <label>Email:</label>
                    <input type="email" name="email">
                </div>
                <div class="input_row">
                    <label>Phone:</label>
                    <input type="text" name="phone">
                </div>
                <div class="input_row">
                    <label>Business Address:</label>
                    <input type="text" name="address_line">
                </div>
                <div class="input_row">
                    <label>Postcode:</label>
                    <input type="text" name="postcode">
                </div>
            </div>

            <!-- SAME FIELDS FOR PRODUCERS AND CUSTOMERS-->
            <!-- PASSWORD -->
            <div class="input_row password_box">
                <label>Password:</label>
                <div class="password_field">
                    <input type="password" id="password" name="password">
                    <!-- ICON -->
                    <i class="fa-solid fa-eye-slash toggle-password" data-target="password"></i>
                </div>
            </div>

            <!-- CONFIRM PASSWORD -->
            <div class="input_row password_wrapper">
                <label>Confirm Password:</label>
                <div class="password_field">
                    <input type="password" id="confirm_password" name="confirm_password">
                    <!-- ICON -->
                    <i class="fa-solid fa-eye-slash toggle-password" data-target="confirm_password"></i>
                </div>
            </div>


            <div class="input_row checkbox">
                <label>
                    <input type="checkbox" name="terms" required>
                    I agree to the <a href="{% url 'tc' %}" target="_blank">Terms and Conditions</a>
                </label>
            </div>
            <!-- ERROR BOX -->
            <div id="registerErrors" style="color:red; margin-bottom:15px; text-align: center;"></div>

            <button type="submit" class="submit-btn">Register</button>

            <p class="login-link">
                Already have an account? <a href="{% url 'login' %}">Login Here</a>
            </p>
        </form>
    </div>
</main>
<script>
document.addEventListener("DOMContentLoaded", function () {
    // Toggle button for passwords
    document.querySelectorAll(".toggle-password").forEach(icon => {
        icon.addEventListener("click", () => {
            // Gets id of input field and finds it on the page
            const targetId = icon.getAttribute("data-target");
            const field = document.getElementById(targetId);
            // It shows the password if it is hidden
            if (field.type === "password") {
                field.type = "text";
                // Removes close eye icon
                icon.classList.remove("fa-eye-slash");
                // Adds open eye icon
                icon.classList.add("fa-eye");
            } else {
                // Hides password 
                field.type = "password";
                // Removes open eye icon
                icon.classList.remove("fa-eye");
                // Adds close eye icon
                icon.classList.add("fa-eye-slash");
            }
        });
    });

    // User role buttons (CUSTOMER / PRODUCER)
    const customerBtn = document.getElementById('customerBtn');
    const producerBtn = document.getElementById('producerBtn');

    const customerTypeSection = document.getElementById('customerTypeSection');
    const custIndividualFields = document.getElementById('custIndividualFields');
    const custCommunityFields = document.getElementById('custCommunityFields');
    const custRestaurantFields = document.getElementById('custRestaurantFields');
    const producerFields = document.getElementById('producerFields');

    // Customer type buttons (NORMAL / COMMUNITY GROUP / RESTAURANT)
    const custIndividualBtn = document.getElementById('custIndividualBtn');
    const custCommunityBtn = document.getElementById('custCommunityBtn');
    const custRestaurantBtn = document.getElementById('custRestaurantBtn');

    // Customer type
    // Only shows the specidic type input fields based on the type of customer selected
    function showCustomerType(type) {
        custIndividualFields.style.display = (type === 'individual') ? 'block' : 'none';
        custCommunityFields.style.display = (type === 'community') ? 'block' : 'none';
        custRestaurantFields.style.display = (type === 'restaurant') ? 'block' : 'none';
    }

    // Sets required only condition fields that are displayed
    // function isVisible(el) {
    //     return !!(el.offsetWidth || el.offsetHeight || el.getClientRects().length);
    // }
    function isVisible(el) {
        return el.offsetParent !== null;
    }
    // This stops the hidden fields from being required which coud have blocked the submisssion
    function setRequired(fields, required) {
        fields.forEach(name => {
            const inputs = document.querySelectorAll(`[name="${name}"]`);
            inputs.forEach(input => {
                if (isVisible(input)) {
                    if (required) input.setAttribute("required", "required");
                    else input.removeAttribute("required");
                } else {
                    // Removes required if input field is hidden 
                    input.removeAttribute("required");
                }
            });
        });
    }

    // Gets the visible field value
    function getVisibleValue(name) {
        const fields = document.querySelectorAll(`[name="${name}"]`);
        for (const field of fields) {
            if (isVisible(field)) {
                return field.value;
            }
        }
        return "";
    }

    // Loads the appropriate form based on if customer or producer is selected 
    customerBtn.addEventListener('click', () => {
        customerBtn.classList.add('active');
        producerBtn.classList.remove('active');

        customerTypeSection.style.display = 'block';
        producerFields.style.display = 'none';

        showCustomerType('individual');
        // Required fields for customer = True
        setRequired(["first_name", "last_name", "email", "phone", "address_line", "postcode"], true);
        // Required fields for producers = False so that it doesnt give an error 
        setRequired(["organisation_name", "organisation_status", "business_name", "contact_first_name", "contact_last_name"], false);
    });

    producerBtn.addEventListener('click', () => {
        producerBtn.classList.add('active');
        customerBtn.classList.remove('active');

        customerTypeSection.style.display = 'none';
        custIndividualFields.style.display = 'none';
        custCommunityFields.style.display = 'none';
        custRestaurantFields.style.display = 'none';
        producerFields.style.display = 'block';
        // Required fields for producers = true
        setRequired(["business_name", "contact_first_name", "contact_last_name", "email", "phone", "address_line", "postcode"], true);
        // Required fields for customers = false so that it doesnt give an error 
        setRequired(["first_name", "last_name", "organisation_name", "organisation_status"], false);
    });


    // Required fields based on the typoe of customer 
    // Normal customer 
    custIndividualBtn.addEventListener('click', () => {
        custIndividualBtn.classList.add('active');
        custCommunityBtn.classList.remove('active');
        custRestaurantBtn.classList.remove('active');
        // Normal customer
        showCustomerType('individual');

        // sets the normal customer fields to true
        setRequired(["first_name", "last_name", "email", "phone", "address_line", "postcode"], true);
        // sets the other fields for community group and resataurant to false
        setRequired(["organisation_name", "organisation_status"], false);
    });
    // Community group customer 
    custCommunityBtn.addEventListener('click', () => {
        custCommunityBtn.classList.add('active');
        custIndividualBtn.classList.remove('active');
        custRestaurantBtn.classList.remove('active');

        // Community group
        showCustomerType('community');
        // sets the community group customer fields to true
        setRequired(["organisation_name", "organisation_status", "email", "phone", "address_line", "postcode"], true);
        // sets non required fields to false 
        setRequired(["first_name", "last_name"], false);
    });

    // Restaurant customer 
    custRestaurantBtn.addEventListener('click', () => {
        custRestaurantBtn.classList.add('active');
        custIndividualBtn.classList.remove('active');
        custCommunityBtn.classList.remove('active');

        // Restaurant
        showCustomerType('restaurant');
        // sets the restauarant customer fields to true
        setRequired(["organisation_name", "email", "phone", "address_line", "postcode"], true);
        // sets non required fields to false 
        setRequired(["first_name", "last_name", "organisation_status"], false);
    });

    // Sets the normal form as the initial form
    // showCustomerType('individual');

    // validation during form submission
    document.getElementById("registerForm").addEventListener("submit", async function (e) {
        e.preventDefault();
        console.log("Register button clicked");

        const errorBox = document.getElementById("registerErrors");
        errorBox.innerHTML = "";

        const form = document.getElementById("registerForm");
        if (!form.checkValidity()) {
            form.reportValidity();
            return;
        }


        // Checks if both the passwords match
        const password = getVisibleValue("password");
        const confirmPassword = getVisibleValue("confirm_password");
        const lowerPassword = password.toLowerCase();

        // If passwords do not match it display an errro message
        if (password !== confirmPassword) {
            errorBox.innerHTML = "Passwords do not match.";
            return;
        }

        // Minimum length
        if (password.length < 8) {
            errorBox.innerHTML = "Password must be at least 8 characters long.";
            return;
        }
        // Must contain at least one uppercase letter
        if (!/[A-Z]/.test(password)) {
            errorBox.innerHTML = "Password must contain at least one uppercase letter.";
            return;
        }
        // Must contain at least one lowercase letter
        if (!/[a-z]/.test(password)) {
            errorBox.innerHTML = "Password must contain at least one lowercase letter.";
            return;
        }
        // Must contain at least one number
        if (!/[0-9]/.test(password)) {
            errorBox.innerHTML = "Password must contain at least one number.";
            return;
        }
        // Must contain at least one special character
        if (!/[!@#$%^&*(),.?":{}|<>]/.test(password)) {
            errorBox.innerHTML = "Password must contain at least one special character.";
            return;
        }

        // Cannot contain spaces
        if (password.includes(" ")) {
            errorBox.innerHTML = "Password cannot contain spaces.";
            return;
        }

        // Cannot contain 4 repeated characters (aaaa, 1111)
        if (/(.)\1\1\1/.test(password)) {
            errorBox.innerHTML = "Password cannot contain 4 or more repeated characters.";
            return;
        }

        // Cannot contain common sequences
        const sequences = ["123", "1234", "abcd", "qwer", "asdf", "zxcv"];
        for (const seq of sequences) {
            if (lowerPassword.includes(seq)) {
                errorBox.innerHTML = "Password cannot contain common keyboard sequences.";
                return;
            }
        }

        // Cannot be numeric only
        if (/^\d+$/.test(password)) {
            errorBox.innerHTML = "Password cannot be entirely numeric.";
            return;
        }

        // Common passwords (frontend approximation of Django list)
        const commonPasswords = new Set([
            "password",
            "password123",
            "12345678",
            "123456789",
            "1234567890",
            "qwerty",
            "abc123",
            "letmein",
            "admin",
            "welcome",
            "123",
            "test",
            "login",
            "princess"
        ]);

        if (commonPasswords.has(password.toLowerCase())) {
            errorBox.innerHTML = "Password is too common.";
            return;
        }

        // Similarity to user info
        // Similarity to user info
        const emailValue = getVisibleValue("email");
        const phoneValue = getVisibleValue("phone");
        const postcodeValue = getVisibleValue("postcode");
        const email = (emailValue || "").toLowerCase();

        // Customer names
        const customerFirst = (getVisibleValue("first_name") || "").toLowerCase();
        const customerLast = (getVisibleValue("last_name") || "").toLowerCase();

        // Producer contact names
        const producerFirst = (getVisibleValue("contact_first_name") || "").toLowerCase();
        const producerLast = (getVisibleValue("contact_last_name") || "").toLowerCase();


        if (
            (email && lowerPassword.includes(email)) ||
            (customerFirst && lowerPassword.includes(customerFirst)) ||
            (customerLast && lowerPassword.includes(customerLast)) ||
            (producerFirst && lowerPassword.includes(producerFirst)) ||
            (producerLast && lowerPassword.includes(producerLast))
        ) {
            errorBox.innerHTML = "Password is too similar to your personal information.";
            return;
        }
        // hecsk if phone number is valid and only included digits
        if (phoneValue && !/^[0-9]+$/.test(phoneValue)) {
            errorBox.innerHTML = "Phone number must contain digits only.";
            return;
        }

        // Checks if email is valid
        const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
        if (!emailPattern.test(emailValue)) {
            errorBox.innerHTML = "Please enter a valid email address.";
            return;
        }

        // Checks if postcode is valid and in UK format
        const postcodePattern = /^[A-Za-z0-9 ]{3,10}$/;
        if (postcodeValue && !postcodePattern.test(postcodeValue)) {
            errorBox.innerHTML = "Please enter a valid postcode.";
            return;
        }

        // Displays error message is organisation name is not entered 
        const orgName = getVisibleValue("organisation_name");
        if ((custCommunityFields.style.display === "block" || custRestaurantFields.style.display === "block") && orgName === "") {
            errorBox.innerHTML = "Organisation name is required.";
            return;
        }

        // Displays error message is business name is not entered 
        const businessName = getVisibleValue("business_name");
        if (producerFields.style.display === "block" && businessName === "") {
            errorBox.innerHTML = "Business name is required.";
            return;
        }


        let role = producerBtn.classList.contains("active") ? "producer" : "customer";
        

        // Sends data as json to backend
        const payload = {
            // values are added to object
            email: emailValue,
            password: password,
            password2: confirmPassword,
            role: role,
            // Account type 
            account_type:
                custCommunityBtn.classList.contains("active") ? "community" :
                custRestaurantBtn.classList.contains("active") ? "restaurant" :
                "normal",

            // These are role depenedent
            contact_first_name: getVisibleValue("contact_first_name"),
            contact_last_name: getVisibleValue("contact_last_name"),

            first_name: role === "producer" ? getVisibleValue("contact_first_name") : getVisibleValue("first_name"),
            last_name: role === "producer" ? getVisibleValue("contact_last_name") : getVisibleValue("last_name"),

            // Contact details 
            phone: phoneValue,
            address_line: getVisibleValue("address_line"),
            postcode: postcodeValue,

            // Organisations details used for community / restaurant 
            organisation_name: orgName,
            organisation_status: getVisibleValue("organisation_status"),

            // Used for producers 
            business_name: businessName,
        };

        // Sends HTTP request to /api/register/
        const response = await fetch("/api/register/", {
            method: "POST", // Sends data to the server
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload) // converts js object to json
        });

        // Waits till server responds 
        // Converts server response to js object
        const data = await response.json();

        // If successful
        if (response.ok) {

            // Determine if this is a business account requiring admin approval
            const isBusiness =
                payload.role === "producer" ||
                payload.account_type === "community" ||
                payload.account_type === "restaurant";

            if (isBusiness) {
                alert("Registration successful! Your account is awaiting admin approval. You will be able to log in once approved.");
            } else {
                alert("Registration successful! You can now log in.");
            }

            window.location.href = "/login/";
        }

        // Displays error message
        else {
            for (const key in data) {
                errorBox.innerHTML += `<p>${key}: ${data[key]}</p>`;
            }
        }
    });
});
</script>

</body>

</html>
