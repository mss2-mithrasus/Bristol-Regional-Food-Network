{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bristol Regional Food Network</title>
    <link rel="stylesheet" href="{% static 'shopping_cart.css' %}">
</head>

<body>

<header class="navbar">
    <div class="nav-left">
        <img src="{% static 'images/leaf.png' %}" alt="Leaf logo" class="logo">
        <span class="title">Bristol Regional Food Network</span>
    </div>

    <nav class="nav-links">
        <a href="{% url 'home' %}" class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">Home</a>
        <a href="{% url 'products_page' %}">Products</a>
        <a href="{% url 'cart_page' %}">Cart</a>
        <a href="#">Login</a>
    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="footer">
    <p>Local Food Marketplace | Supporting Local Farmers</p>
</footer>

</body>
</html>
