

{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Bristol Regional Food Network</title>

    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <!-- Your CSS -->
    <link rel="stylesheet" href="{% static 'shopping_cart.css' %}">
</head>

<body>

<header class="navbar">
    <div class="nav-left">
        <img src="{% static 'images/leaf.png' %}" alt="Leaf logo" class="logo">
        <span class="title">Bristol Regional Food Network</span>
    </div>

    <nav class="nav-links">

        <!-- Home -->
        <a href="{% url 'home' %}"
           class="{% if request.resolver_match.url_name == 'home' %}active{% endif %}">
           Home
        </a>

        <!-- Products -->
        <a href="{% url 'products_page' %}">Products</a>

        <!-- Cart icon -->
        <a href="{% url 'cart_page' %}">
            <i class="fa-solid fa-cart-shopping"></i>
        </a>

        <!-- Bell icon (placeholder) -->
        <a href="#">
            <i class="fa-solid fa-bell"></i>
        </a>

        <!-- User icon -->
        <a href="#">
            <i class="fa-solid fa-user"></i>
        </a>

    </nav>
</header>

<main>
    {% block content %}
    {% endblock %}
</main>

<footer class="footer">
    <p>Local Food Marketplace | Supporting Local Farmers</p>
</footer>

</body>
</html>
