{% extends "base.html" %}
{% block content %}

<h2 style="text-align:center;">Your Cart</h2>

<div class="cart-container">

    {% if items %}
        {% for item in items %}
            <div class="cart-item">

                <!-- PRODUCT IMAGE -->
                <img src="{{ item.product.image.url }}" alt="{{ item.product.name }}">

                <!-- PRODUCT DETAILS -->
                <div>
                    <h4>{{ item.product.name }}</h4>
                    <p>£{{ item.unit_price }}</p>
                </div>

                <!-- QUANTITY + REMOVE CONTROLS -->
                <div class="cart-controls">

                    <!-- UPDATE QUANTITY -->
                    <form action="{% url 'update_quantity' item.cart_item_id %}" method="POST" style="display:inline;">
                        {% csrf_token %}
                        <button name="action" value="decrease">-</button>
                        {{ item.quantity }}
                        <button name="action" value="increase">+</button>
                    </form>

                    <!-- REMOVE ITEM -->
                    <form action="{% url 'remove_item' item.cart_item_id %}" method="POST" style="display:inline;">
                        {% csrf_token %}
                        <button class="remove-btn">Remove</button>
                    </form>

                </div>
            </div>
        {% endfor %}
    {% else %}
        <p style="text-align:center; margin-top:20px;">Your cart is empty.</p>
    {% endif %}

    <div class="cart-total">Total: £{{ total }}</div>
    <button class="checkout-btn">Proceed to Payment</button>

</div>

{% endblock %}
