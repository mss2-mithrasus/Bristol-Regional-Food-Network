{% extends "producer_base.html" %}

{% block content %}

<div class="welcome">
  <h1>Products</h1>
  <p>Manage your product listings.</p>
</div>

<section class="panel">
  <div class="panel-header-row">
    <h2>My Product Listings</h2>
    <a class="button-pill" href="/producer/product_management/add/">Add New Product</a>
  </div>

  <div id="productsError" style="color:red; margin: 10px 0;"></div>

  <div class="table-wrap">
    <div class="prod-table head">
      <div>Name</div>
      <div>Category</div>
      <div>Price</div>
      <div>Unit</div>
      <div>Stock</div>
      <div>Status</div>
      <div>Actions</div>
    </div>

    <!-- rows will be injected here -->
    <div id="productsRows"></div>
  </div>
</section>

<!-- EDIT MODAL -->
<div id="editModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3 style="margin:0 0 10px;">Edit Product</h3>

    <input type="hidden" id="editProductId">

    <div class="form-grid" style="margin-top:12px;">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="editName" required>
      </div>

      <div class="form-group">
        <label>Price (£)</label>
        <input type="number" step="0.01" id="editPrice" min="0" required>
      </div>

      <div class="form-group">
        <label>Unit</label>
        <input type="text" id="editUnit" required>
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" id="editStock" min="0" required>
      </div>
      <div class="form-group">
        <label>Season Start</label>
        <input type="date" id="editSeasonStart">
      </div>

      <div class="form-group">
        <label>Season End</label>
        <input type="date" id="editSeasonEnd">
      </div>
      <div class="form-group form-group-full">
        <div class="checkbox-row">
          <label class="checkbox-item">
            <input type="checkbox" id="editIsYearRound">
            <span>Available all year</span>
          </label>

          <label class="checkbox-item">
            <input type="checkbox" id="editAvailable">
            <span>Available</span>
          </label>
        </div>
      </div>
      <div class="form-group form-group-full">
        <label>Product Image</label>
        <input type="file" id="editImage" accept="image/*">
        <img id="editImagePreview" style="max-width:120px; margin-top:6px; display:none;">
      </div>

      
    </div>

    <div id="editErrors" style="color:red; margin-top:10px;"></div>

    <div class="form-actions" style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
      <button id="saveEditBtn" class="button-pill" type="button">Save</button>
      <button id="cancelEditBtn" class="button-pill secondary" type="button">Cancel</button>
    </div>
  </div>
</div>

<style>
/* Modal styling */
.modal{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.modal-content{
  background: #fff;
  width: min(520px, 92vw);
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.18);
}
</style>

<script>
  
document.addEventListener("DOMContentLoaded", async () => {
  // const token = localStorage.getItem("access");
  const token = localStorage.getItem("access") || sessionStorage.getItem("access");
  const errorBox = document.getElementById("productsError");
  const rowsBox = document.getElementById("productsRows");

  // Edit modal refs
  const editModal = document.getElementById("editModal");
  const editErrors = document.getElementById("editErrors");
  const cancelEditBtn = document.getElementById("cancelEditBtn");
  const saveEditBtn = document.getElementById("saveEditBtn");
  const yearRoundCheckbox = document.getElementById("editIsYearRound");
  const seasonStartInput = document.getElementById("editSeasonStart");
  const seasonEndInput = document.getElementById("editSeasonEnd");

  let savedSeasonStart = "";
  let savedSeasonEnd = "";
  function toggleSeasonFields() {
    const isYearRound = yearRoundCheckbox.checked;

    if (isYearRound) {
      // Save current values before clearing
      savedSeasonStart = seasonStartInput.value;
      savedSeasonEnd = seasonEndInput.value;

      seasonStartInput.value = "";
      seasonEndInput.value = "";
      seasonStartInput.disabled = true;
      seasonEndInput.disabled = true;
    } else {
      // Restore saved values when unchecked
      seasonStartInput.value = savedSeasonStart;
      seasonEndInput.value = savedSeasonEnd;
      seasonStartInput.disabled = false;
      seasonEndInput.disabled = false;
    }
  }

  // listen for checkbox change
  yearRoundCheckbox.addEventListener("change", toggleSeasonFields);
  rowsBox.innerHTML = "";
  errorBox.textContent = "";

  if (!token) {
    errorBox.textContent = "You are not logged in. Please log in again.";
    return;
  }

  function getStatusTag(p) {
    const stock = Number(p.stock_quantity ?? 0);

    if (!p.availability_status) return `<span class="tag red">Unavailable</span>`;
    if (stock === 0) return `<span class="tag red">Out of Stock</span>`;
    if (stock > 0 && stock <= 10) return `<span class="tag amber">Low Stock</span>`;
    return `<span class="tag green">In Stock</span>`;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function closeEditModal(){
    editModal.style.display = "none";
  }

  cancelEditBtn.addEventListener("click", closeEditModal);
  editModal.addEventListener("click", (e) => { if (e.target === editModal) closeEditModal(); });

  // Load products
  try {
    const res = await fetch("/producer/api/products/", {
      method: "GET",
      headers: { "Authorization": `Bearer ${token}` }
    });

    const data = await res.json();

    if (!res.ok) {
      errorBox.textContent = data.detail || data.error || "Failed to load products.";
      return;
    }

    if (!Array.isArray(data) || data.length === 0) {
      rowsBox.innerHTML = `
        <div style="padding: 14px;">
          No products yet. Click <b>Add New Product</b> to create one.
        </div>
      `;
      return;
    }

    rowsBox.innerHTML = data.map(p => {
      const name = escapeHtml(p.name);
      const category = escapeHtml(p.category_name ?? p.category);
      const unit = escapeHtml(p.unit);
      const price = escapeHtml(p.price);
      const stock = escapeHtml(p.stock_quantity);
      const imageUrl = escapeHtml(p.image_url ?? p.image ?? "");
      return `
        <div class="prod-table row" data-product-id="${p.product_id}"data-image-url="${imageUrl}"data-season-start="${p.season_start_date || ""}"data-season-end="${p.season_end_date || ""}">
          <div class="cell-name">${name}</div>
          <div class="cell-category">${category}</div>
          <div class="cell-price">£${price}</div>
          <div class="cell-unit">${unit}</div>
          <div class="cell-stock">${stock}</div>
          <div class="cell-status">${getStatusTag(p)}</div>
          <div class="actions">
            <button class="mini-btn" data-action="edit" data-id="${p.product_id}">Edit</button>
            <button class="mini-btn danger" data-action="delete" data-id="${p.product_id}">Delete</button>
          </div>
        </div>
      `;
    }).join("");

    //  One click handler for edit + delete
    rowsBox.addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;

      //  EDIT
      if (action === "edit") {
        editErrors.textContent = "";

        const row = document.querySelector(`[data-product-id="${id}"]`);
        if (!row) return;

        const name = row.querySelector(".cell-name")?.innerText?.trim() || "";
        const price = (row.querySelector(".cell-price")?.innerText || "").replace("£","").trim();
        const unit = row.querySelector(".cell-unit")?.innerText?.trim() || "";
        const stock = row.querySelector(".cell-stock")?.innerText?.trim() || "";
        const statusText = row.querySelector(".cell-status")?.innerText?.toLowerCase() || "";
        const available = !statusText.includes("unavailable");
        const imgUrl = row.dataset.imageUrl || "";
        const preview = document.getElementById("editImagePreview");
        const fileInput = document.getElementById("editImage");
        const seasonStart = row.dataset.seasonStart || "";
        const seasonEnd = row.dataset.seasonEnd || "";
        const isYearRound = !seasonStart && !seasonEnd;
        savedSeasonStart = seasonStart;
        savedSeasonEnd = seasonEnd;
        // reset file input every time you open modal
        fileInput.value = "";

        if (imgUrl) {
          preview.src = imgUrl;
          preview.style.display = "block";
        } else {
          preview.src = "";
          preview.style.display = "none";
      }

        // live preview when user picks a new file
        fileInput.onchange = () => {
          const f = fileInput.files?.[0];
          if (!f) return;

          const url = URL.createObjectURL(f);
          preview.src = url;
          preview.style.display = "block";
        };

        document.getElementById("editProductId").value = id;
        document.getElementById("editName").value = name;
        document.getElementById("editPrice").value = price;
        document.getElementById("editUnit").value = unit;
        document.getElementById("editStock").value = stock;
        document.getElementById("editAvailable").checked = available;
        document.getElementById("editSeasonStart").value = seasonStart;
        document.getElementById("editSeasonEnd").value = seasonEnd;
        document.getElementById("editIsYearRound").checked = isYearRound;
        toggleSeasonFields();
        editModal.style.display = "flex";
        return;
      }

      //  DELETE
      if (action === "delete") {
        showRemoveMessage(id);
        return;

      }
    });

    //  SAVE EDIT 
    saveEditBtn.addEventListener("click", async () => {
      editErrors.textContent = "";

      const token = localStorage.getItem("access")|| sessionStorage.getItem("access");
      if (!token) {
        editErrors.textContent = "Token missing. Please log in again.";
        return;
      }

      const id = document.getElementById("editProductId").value;

      //  Build multipart payload
      const formData = new FormData();
      const name = document.getElementById("editName").value.trim();
      const price = document.getElementById("editPrice").value;
      const unit = document.getElementById("editUnit").value.trim();
      const stock = document.getElementById("editStock").value;
      const available = document.getElementById("editAvailable").checked;

      formData.append("name", name);
      formData.append("price", price);
      formData.append("unit", unit);
      formData.append("stock_quantity", stock);
      formData.append("season_start_date", document.getElementById("editSeasonStart").value);
      formData.append("season_end_date", document.getElementById("editSeasonEnd").value);
      formData.append("is_year_round", document.getElementById("editIsYearRound").checked ? "true" : "false");
      // Some backends expect "true"/"false" strings in multipart
      formData.append("availability_status", available? "true" : "false");

      //  Optional image
      const imageFile = document.getElementById("editImage")?.files?.[0];
      if (imageFile) {
        formData.append("image", imageFile); // <-- change key if your backend uses a different field name
      }

      try {
        const res = await fetch(`/producer/api/products/${id}/update/`, {
          method: "PUT", 
          headers: {
            "Authorization": `Bearer ${token}`
        
          },
          body: formData
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          editErrors.textContent = data.detail || data.error || "Update failed.";
          return;
        }

        //  Update UI instantly
        const row = document.querySelector(`[data-product-id="${id}"]`);
        if (row) {
          row.querySelector(".cell-name").innerText = name;
          row.querySelector(".cell-price").innerText = `£${price}`;
          row.querySelector(".cell-unit").innerText = unit;
          row.querySelector(".cell-stock").innerText = stock;

          row.querySelector(".cell-status").innerHTML = getStatusTag({
            stock_quantity: stock,
            availability_status: available
          });
          row.dataset.seasonStart = document.getElementById("editSeasonStart").value;
          row.dataset.seasonEnd = document.getElementById("editSeasonEnd").value;
          row.dataset.isYearRound = document.getElementById("editIsYearRound").checked ? "true" : "false";

          // If backend returns updated image URL, store it for next edit open
          if (data.image_url || data.image) {
            row.dataset.imageUrl = data.image_url || data.image;
          }
        }

        closeEditModal();
        showSuccessPopup("Product updated successfully!");
      } catch (err) {
        console.error(err);
        editErrors.textContent = "Unexpected error updating product.";
      }
    });

    } catch (err) {
      console.error(err);
      errorBox.textContent = "Unexpected error loading products.";
    }
  });
  
// Lano - product user wants to remove
    let productSelected = null;

    function showRemoveMessage(id){
        productSelected = id;
        document.getElementById("deleteProduct").style.display = "flex";
    }

    function confirmDeletion(){

        document.getElementById("deleteProduct").style.display = "none";
        deleteProduct(productSelected);
    }

    function noRemoval(){
        document.getElementById("deleteProduct").style.display = "none"
    }
    function showSuccessPopup(message){
      document.getElementById("successMessage").innerText = message;
      document.getElementById("successPopup").style.display = "flex";
    }

    function closeSuccessPopup(){
      document.getElementById("successPopup").style.display = "none";
    }
// Lano - product user wants to remove



    async function deleteProduct(id) {
  try {
          const res = await fetch(`/producer/api/products/${id}/delete/`, {
            method: "DELETE",
            // headers: { "Authorization": `Bearer ${localStorage.getItem("access")}` }
            headers: {
              "Authorization": `Bearer ${
                localStorage.getItem("access") || sessionStorage.getItem("access")
              }`
            }
          });
          

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            alert(data.detail || data.error || "Delete failed.");
            return;
          }

          const row = document.querySelector(`[data-product-id="${id}"]`);
          if (row) row.remove();

        } catch (err) {
          console.error(err);
          alert("Unexpected error deleting product.");
        }
      }
    



</script>

<!-- Lano added pop up message -->

<div id="deleteProduct" class="remove-item" style="display:none;">
    <div class="remove-box">
        <p>Delete this product?</p>
        <div class="removal-actions">
            <button onclick="confirmDeletion()">Delete</button>
            <button onclick="noRemoval()">Cancel</button>
        </div>
    </div>
</div>
  
<!-- pop up message for update -->
<div id="successPopup" class="remove-item" style="display:none;">
  <div class="remove-box">
    <p id="successMessage">Product updated successfully!</p>
    <div class="removal-actions">
      <button onclick="closeSuccessPopup()">OK</button>
    </div>
  </div>
</div>



{% endblock %}
