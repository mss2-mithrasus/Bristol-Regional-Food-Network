{% extends "producer_base.html" %}

{% block content %}

<div class="welcome">
  <h1>Products</h1>
  <p>Manage your product listings.</p>
</div>

<section class="panel">
  <div class="panel-header-row">
    <h2>My Product Listings</h2>
    <a class="button-pill" href="/producer/product_management/add/">Add New Product</a>
  </div>

  <div id="productsError" style="color:red; margin: 10px 0;"></div>

  <div class="table-wrap">
    <div class="prod-table head">
      <div>Name</div>
      <div>Category</div>
      <div>Price</div>
      <div>Unit</div>
      <div>Stock</div>
      <div>Status</div>
      <div>Actions</div>
    </div>

    <!-- rows will be injected here -->
    <div id="productsRows"></div>
  </div>
</section>

<!-- ✅ EDIT MODAL -->
<div id="editModal" class="modal" style="display:none;">
  <div class="modal-content">
    <h3 style="margin:0 0 10px;">Edit Product</h3>

    <input type="hidden" id="editProductId">

    <div class="form-grid" style="margin-top:12px;">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="editName" required>
      

      
      </div>
      <div class="form-group">
        <label>Price (£)</label>
        <input type="number" step="0.01" id="editPrice" min="0" required>
      </div>

      <div class="form-group">
        <label>Unit</label>
        <input type="text" id="editUnit" required>
      </div>

      <div class="form-group">
        <label>Stock</label>
        <input type="number" id="editStock" min="0" required>
      </div>

      <div class="form-group form-group-full" style="margin-top:6px;">
        <label style="display:flex; gap:10px; align-items:center;">
          <input type="checkbox" id="editAvailable">
          Available
        </label>
      </div>
    </div>

    <div id="editErrors" style="color:red; margin-top:10px;"></div>

    <div class="form-actions" style="margin-top:16px; display:flex; gap:10px; justify-content:flex-end;">
      <button id="saveEditBtn" class="button-pill" type="button">Save</button>
      <button id="cancelEditBtn" class="button-pill secondary" type="button">Cancel</button>
    </div>
  </div>
</div>

<style>
/* ✅ Modal styling */
.modal{
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}
.modal-content{
  background: #fff;
  width: min(520px, 92vw);
  padding: 18px;
  border-radius: 14px;
  box-shadow: 0 18px 50px rgba(0,0,0,0.18);
}
</style>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const token = localStorage.getItem("access");
  const errorBox = document.getElementById("productsError");
  const rowsBox = document.getElementById("productsRows");

  // Edit modal refs
  const editModal = document.getElementById("editModal");
  const editErrors = document.getElementById("editErrors");
  const cancelEditBtn = document.getElementById("cancelEditBtn");
  const saveEditBtn = document.getElementById("saveEditBtn");

  rowsBox.innerHTML = "";
  errorBox.textContent = "";

  if (!token) {
    errorBox.textContent = "You are not logged in. Please log in again.";
    return;
  }

  function getStatusTag(p) {
    const stock = Number(p.stock_quantity ?? 0);

    if (!p.availability_status) return `<span class="tag red">Unavailable</span>`;
    if (stock === 0) return `<span class="tag red">Out of Stock</span>`;
    if (stock > 0 && stock <= 10) return `<span class="tag amber">Low Stock</span>`;
    return `<span class="tag green">In Stock</span>`;
  }

  function escapeHtml(str) {
    if (str === null || str === undefined) return "";
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function closeEditModal(){
    editModal.style.display = "none";
  }

  cancelEditBtn.addEventListener("click", closeEditModal);
  editModal.addEventListener("click", (e) => { if (e.target === editModal) closeEditModal(); });

  // ✅ Load products
  try {
    const res = await fetch("/producer/api/products/", {
      method: "GET",
      headers: { "Authorization": `Bearer ${token}` }
    });

    const data = await res.json();

    if (!res.ok) {
      errorBox.textContent = data.detail || data.error || "Failed to load products.";
      return;
    }

    if (!Array.isArray(data) || data.length === 0) {
      rowsBox.innerHTML = `
        <div style="padding: 14px;">
          No products yet. Click <b>Add New Product</b> to create one.
        </div>
      `;
      return;
    }

    rowsBox.innerHTML = data.map(p => {
      const name = escapeHtml(p.name);
      const category = escapeHtml(p.category_name ?? p.category);
      const unit = escapeHtml(p.unit);
      const price = escapeHtml(p.price);
      const stock = escapeHtml(p.stock_quantity);

      return `
        <div class="prod-table row" data-product-id="${p.product_id}">
          <div class="cell-name">${name}</div>
          <div class="cell-category">${category}</div>
          <div class="cell-price">£${price}</div>
          <div class="cell-unit">${unit}</div>
          <div class="cell-stock">${stock}</div>
          <div class="cell-status">${getStatusTag(p)}</div>
          <div class="actions">
            <button class="mini-btn" data-action="edit" data-id="${p.product_id}">Edit</button>
            <button class="mini-btn danger" data-action="delete" data-id="${p.product_id}">Delete</button>
          </div>
        </div>
      `;
    }).join("");

    // ✅ One click handler for edit + delete
    rowsBox.addEventListener("click", async (e) => {
      const btn = e.target.closest("button");
      if (!btn) return;

      const action = btn.dataset.action;
      const id = btn.dataset.id;

      // ✅ EDIT
      if (action === "edit") {
        editErrors.textContent = "";

        const row = document.querySelector(`[data-product-id="${id}"]`);
        if (!row) return;

        const name = row.querySelector(".cell-name")?.innerText?.trim() || "";
        const price = (row.querySelector(".cell-price")?.innerText || "").replace("£","").trim();
        const unit = row.querySelector(".cell-unit")?.innerText?.trim() || "";
        const stock = row.querySelector(".cell-stock")?.innerText?.trim() || "";
        const statusText = row.querySelector(".cell-status")?.innerText?.toLowerCase() || "";
        const available = !statusText.includes("unavailable");

        document.getElementById("editProductId").value = id;
        document.getElementById("editName").value = name;
        document.getElementById("editPrice").value = price;
        document.getElementById("editUnit").value = unit;
        document.getElementById("editStock").value = stock;
        document.getElementById("editAvailable").checked = available;

        editModal.style.display = "flex";
        return;
      }

      // ✅ DELETE
      if (action === "delete") {
        const confirmDelete = confirm("Are you sure you want to delete this product?");
        if (!confirmDelete) return;

        try {
          const res = await fetch(`/producer/api/products/${id}/delete/`, {
            method: "DELETE",
            headers: { "Authorization": `Bearer ${localStorage.getItem("access")}` }
          });

          const data = await res.json().catch(() => ({}));

          if (!res.ok) {
            alert(data.detail || data.error || "Delete failed.");
            return;
          }

          const row = document.querySelector(`[data-product-id="${id}"]`);
          if (row) row.remove();

          alert("Product deleted successfully!");
        } catch (err) {
          console.error(err);
          alert("Unexpected error deleting product.");
        }
      }
    });

    // ✅ SAVE EDIT (PUT)
    saveEditBtn.addEventListener("click", async () => {
      editErrors.textContent = "";

      const token = localStorage.getItem("access");
      if (!token) {
        editErrors.textContent = "Token missing. Please log in again.";
        return;
      }

      const id = document.getElementById("editProductId").value;

      const payload = {
        name: document.getElementById("editName").value.trim(),
        price: document.getElementById("editPrice").value,
        unit: document.getElementById("editUnit").value.trim(),
        stock_quantity: document.getElementById("editStock").value,
        availability_status: document.getElementById("editAvailable").checked
      };

      try {
        const res = await fetch(`/producer/api/products/${id}/update/`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(payload)
        });

        const data = await res.json().catch(() => ({}));

        if (!res.ok) {
          editErrors.textContent = data.detail || data.error || "Update failed.";
          return;
        }

        // Update UI instantly
        const row = document.querySelector(`[data-product-id="${id}"]`);
        if (row) {
          row.querySelector(".cell-name").innerText = payload.name;
          row.querySelector(".cell-price").innerText = `£${payload.price}`;
          row.querySelector(".cell-unit").innerText = payload.unit;
          row.querySelector(".cell-stock").innerText = payload.stock_quantity;

          row.querySelector(".cell-status").innerHTML = getStatusTag({
            stock_quantity: payload.stock_quantity,
            availability_status: payload.availability_status
          });
        }

        closeEditModal();
        alert("Product updated successfully!");
      } catch (err) {
        console.error(err);
        editErrors.textContent = "Unexpected error updating product.";
      }
    });

  } catch (err) {
    console.error(err);
    errorBox.textContent = "Unexpected error loading products.";
  }
});
</script>

{% endblock %}
