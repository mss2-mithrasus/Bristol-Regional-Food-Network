{% load static %}
<div class="low-stock-widget">
    <div class="widget-header">
        <h3><i class="fa-solid fa-exclamation-triangle"></i> Low Stock Alerts</h3>
        <span id="lowStockCount" class="alert-count">0</span>
    </div>
    <div id="lowStockList" class="low-stock-list">
        <div class="loading">Loading alerts...</div>
    </div>
</div>

<!-- Custom Confirmation Modal -->
<div id="restockConfirmModal" class="custom-confirm-modal" style="display: none;">
    <div class="custom-confirm-content">
        <div class="custom-confirm-icon">
            <i class="fa-solid fa-question-circle"></i>
        </div>
        <h3 id="confirmProductName">Restock Product?</h3>
        <p id="confirmMessage">Have you restocked this product?</p>
        <div class="custom-confirm-actions">
            <button id="confirmResolveBtn" class="confirm-btn yes">
                <i class="fa-solid fa-check"></i> Yes, Restocked
            </button>
            <button id="cancelResolveBtn" class="confirm-btn no">
                <i class="fa-solid fa-times"></i> Cancel
            </button>
        </div>
    </div>
</div>

<style>
.low-stock-widget {
    background: white;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 25px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05);
    border: 1px solid #e0e0e0;
}

.widget-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 15px;
    padding-bottom: 10px;
    border-bottom: 2px solid #f0f0f0;
}

.widget-header h3 {
    margin: 0;
    font-size: 18px;
    color: #406083;
    display: flex;
    align-items: center;
    gap: 8px;
}

.widget-header h3 i {
    color: #ffc107;
}

.alert-count {
    background: #dc3545;
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 12px;
    font-weight: 600;
}

.low-stock-list {
    max-height: 300px;
    overflow-y: auto;
}

.low-stock-item {
    display: flex;
    align-items: center;
    gap: 15px;
    padding: 12px;
    border-bottom: 1px solid #f0f0f0;
    transition: background 0.2s;
}

.low-stock-item:hover {
    background: #fff8f0;
}

.low-stock-item img {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    object-fit: cover;
}

.low-stock-info {
    flex: 1;
}

.low-stock-info h4 {
    margin: 0 0 4px 0;
    font-size: 14px;
    color: #333;
}

.low-stock-details {
    font-size: 12px;
    color: #666;
}

.low-stock-details .stock-warning {
    color: #dc3545;
    font-weight: 600;
}

.resolve-btn {
    padding: 6px 12px;
    background: #28a745;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    transition: background 0.2s;
}

.resolve-btn:hover {
    background: #218838;
}

.loading {
    text-align: center;
    padding: 20px;
    color: #999;
}

.empty-alerts {
    text-align: center;
    padding: 30px;
    color: #28a745;
}

.empty-alerts i {
    font-size: 40px;
    margin-bottom: 10px;
    color: #28a745;
}

.empty-alerts p {
    margin: 0;
    font-size: 14px;
}

/* Custom Modal Styles */
.custom-confirm-modal {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10000;
    animation: fadeIn 0.2s ease;
}

.custom-confirm-content {
    background: white;
    border-radius: 16px;
    padding: 25px 30px;
    text-align: center;
    max-width: 400px;
    width: 90%;
    animation: slideIn 0.3s ease;
    box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
}

.custom-confirm-icon {
    font-size: 60px;
    color: #ffc107;
    margin-bottom: 15px;
}

.custom-confirm-icon i {
    font-size: 60px;
}

.custom-confirm-content h3 {
    margin: 0 0 10px 0;
    font-size: 22px;
    color: #333;
}

.custom-confirm-content p {
    margin: 0 0 25px 0;
    color: #666;
    font-size: 14px;
}

.custom-confirm-actions {
    display: flex;
    gap: 15px;
    justify-content: center;
}

.confirm-btn {
    padding: 10px 20px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    display: inline-flex;
    align-items: center;
    gap: 6px;
}

.confirm-btn.yes {
    background: #28a745;
    color: white;
}

.confirm-btn.yes:hover {
    background: #218838;
    transform: translateY(-2px);
}

.confirm-btn.no {
    background: #6c757d;
    color: white;
}

.confirm-btn.no:hover {
    background: #5a6268;
    transform: translateY(-2px);
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

@keyframes slideIn {
    from {
        transform: translateY(-50px);
        opacity: 0;
    }
    to {
        transform: translateY(0);
        opacity: 1;
    }
}
</style>

<script>
// Variables to store the pending alert
let pendingAlertId = null;
let pendingProductName = null;

function showRestockConfirmModal(alertId, productName) {
    pendingAlertId = alertId;
    pendingProductName = productName;
    
    const modal = document.getElementById('restockConfirmModal');
    const confirmTitle = document.getElementById('confirmProductName');
    const confirmMsg = document.getElementById('confirmMessage');
    
    confirmTitle.innerHTML = ` Restock ${productName}?`;
    confirmMsg.innerHTML = `Have you restocked ${productName}? This will resolve the low stock alert.`;
    
    modal.style.display = 'flex';
}

function closeRestockConfirmModal() {
    const modal = document.getElementById('restockConfirmModal');
    modal.style.display = 'none';
    pendingAlertId = null;
    pendingProductName = null;
}

function resolveLowStockAlertWithConfirm() {
    if (!pendingAlertId) return;
    
    const token = getAccessToken();
    if (!token) return;
    
    // Close modal first
    closeRestockConfirmModal();
    
    // Show loading state on the resolve button
    const resolveBtn = document.querySelector(`.low-stock-item[data-alert-id="${pendingAlertId}"] .resolve-btn`);
    if (resolveBtn) {
        const originalText = resolveBtn.innerHTML;
        resolveBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Resolving...';
        resolveBtn.disabled = true;
    }
    
    fetch(`/producer/api/low-stock-alerts/${pendingAlertId}/resolve/`, {
        method: 'POST',
        headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            loadLowStockAlerts(); // Refresh the list
            showNotification(` ${pendingProductName} alert resolved!`, 'success');
        } else {
            showNotification(` Failed to resolve alert for ${pendingProductName}`, 'error');
        }
    })
    .catch(error => {
        console.error('Error resolving alert:', error);
        showNotification('Error resolving alert', 'error');
    })
    .finally(() => {
        pendingAlertId = null;
        pendingProductName = null;
    });
}

function loadLowStockAlerts() {
    const token = getAccessToken();
    if (!token) return;
    
    fetch('/producer/api/low-stock-alerts/', {
        headers: { 'Authorization': 'Bearer ' + token }
    })
    .then(response => response.json())
    .then(data => {
        const container = document.getElementById('lowStockList');
        const countSpan = document.getElementById('lowStockCount');
        
        if (data.alert_count === 0) {
            container.innerHTML = `
                <div class="empty-alerts">
                    <i class="fa-solid fa-check-circle"></i>
                    <p>No low stock alerts</p>
                    <small>All products have sufficient stock</small>
                </div>
            `;
            countSpan.textContent = '0';
            countSpan.style.background = '#28a745';
            return;
        }
        
        countSpan.textContent = data.alert_count;
        countSpan.style.background = '#dc3545';
        
        let html = '';
        data.alerts.forEach(alert => {
            const alertTime = alert.created_at_formatted;
            html += `
                <div class="low-stock-item" data-alert-id="${alert.alert_id}">
                    <img src="${alert.product_image || '/static/images/default-product.png'}" alt="${alert.product_name}">
                    <div class="low-stock-info">
                        <h4>${alert.product_name}</h4>
                        <div class="low-stock-details">
                            <span class="stock-warning">⚠️ Only ${alert.current_stock} ${alert.unit} remaining</span>
                            <span> (Threshold: ${alert.threshold})</span>
                        </div>
                        <small>Alert since: ${alert.created_at_formatted}</small>
                    </div>
                    <button class="resolve-btn" onclick="showRestockConfirmModal(${alert.alert_id}, '${alert.product_name}')">
                        <i class="fa-solid fa-check"></i> Resolved
                    </button>
                </div>
            `;
        });
        container.innerHTML = html;
    })
    .catch(error => {
        console.error('Error loading low stock alerts:', error);
        document.getElementById('lowStockList').innerHTML = '<div class="loading">Error loading alerts</div>';
    });
}

function showNotification(message, type) {
    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.innerHTML = `<span>${message}</span><button onclick="this.parentElement.remove()">×</button>`;
    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 3000);
}

// Load alerts on page load
document.addEventListener('DOMContentLoaded', function() {
    if (document.getElementById('lowStockList')) {
        loadLowStockAlerts();
        // Refresh every 30 seconds
        setInterval(loadLowStockAlerts, 30000);
    }
    
    // Set up modal event listeners
    const confirmBtn = document.getElementById('confirmResolveBtn');
    const cancelBtn = document.getElementById('cancelResolveBtn');
    const modal = document.getElementById('restockConfirmModal');
    
    if (confirmBtn) {
        confirmBtn.addEventListener('click', resolveLowStockAlertWithConfirm);
    }
    
    if (cancelBtn) {
        cancelBtn.addEventListener('click', closeRestockConfirmModal);
    }
    
    // Close modal when clicking outside
    if (modal) {
        modal.addEventListener('click', function(e) {
            if (e.target === modal) {
                closeRestockConfirmModal();
            }
        });
    }
});
</script>
