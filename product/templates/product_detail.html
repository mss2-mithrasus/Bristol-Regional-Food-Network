<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

{%extends "base.html"%}

{% load static %}

{% block head %}

    {{ block.super }}
    <link rel="stylesheet" href="{% static 'product_detail.css' %}">
    
{% endblock %}


{% block content%}
 <!--<img src="/static/images/organic.png" class="organic-badge" style="display:;">-->


<div class="product-detail-container">
    <div class="product-image-container">
        <img  class="product-detail-img" src="" alt="product image">
    </div>
       
    
    <div class="product-info-container">
        <div class="product-box product-details-box">
        
            <h3 class="product-name"></h3>
            <h4 class="product-price"></h4>
            <h4 class="product-producer"></h4>
            <h4 class="product-description"></h4>

            <div class="button-group">
                        <div class="quantity">
                            <button class="minus">-</button>
                            <span class="quantity-display">1</span>
                            <button class="plus">+</button>
                        </div>
                        <button class="add-cart">Add to Cart</button>
                    </div> 


                    <button class="notify-btn"
                            data-product-id="${product.product_id }"
                            onclick="showStockAlert(event, ${product.product_id}, '${product.name}')"
                            style="display: none;">
                        <i class="fa-regular fa-bell"></i> Notify when available
                    </button>


        </div>

        <div class="product-box farm-miles-box">
            <h4 class="farm-miles"></h4>
        </div>


        <div class="product-box allergens-box">
            <h3>Allergens</h3>
            <ul class="allergens-list"></ul>

        </div>

    </div>

</div>
{%endblock%}

{% block scripts%}

<script>

    //function for auth token
    function getToken(){
        // checking local storage and session storage
        return localStorage.getItem("access") || sessionStorage.getItem("access");

    }

    // variable to store product_id
    const productId = "{{product_id}}";

    // mapping allergens
    const allergenMap = {
        {% for allergen in allergens%}
        "{{ allergen.allergen_id}}" : "{{allergen.name}}"
        {%endfor%}
    };

    // function to fetch product details from api
    async function ProductDetails(){
        // get auth token
        const token = getToken();

        try {
            // try request to api to fetch product details
            const response = await fetch(`/customer/home/api/product/${productId}/`, {
                headers:{
                    "Authorization": "Bearer " + token
                }
            });

            // otherwise show error response
            if (!response.ok){
                console.error("error loading product");
                return;
            }
            // covert the response to json
            const data = await response.json();
            const product = data.product;
            const allergens = data.allergens || [];

            // inserting product name, description and producer name into page
            document.querySelector(".product-name").textContent = "Product: " + product.name;

            document.querySelector(".product-description").textContent = "Product description: " + product.description;

            document.querySelector(".product-price").textContent = "Price: £" + product.price;

            document.querySelector(".product-producer").textContent = "Producer: " + product.producer_name;

            const image = document.querySelector(".product-detail-img");

            // if theres an image display it too
            if (product.image){
                image.src = product.image;
            }

            if(data.farm_miles !== null){  
                const farmMiles = document.querySelector(".farm-miles");

                if (data.farm_miles <= 20) {
                    farmMiles.innerHTML = `
                    
                    <i class="fa-solid fa-car"></i>
                    Farm miles: ${data.farm_miles} miles
                    <br>

                    
                    <i class="fa-regular fa-face-smile"></i>
                    Great news! This product is within our 20 mile producer to customer commitment.
                   
                    `;

                }else{
                        farmMiles.innerHTML = `
                        Farm miles: ${data.farm_miles} miles
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        This product is over 20 miles away. Consider browsing more local producers.
                        
                        `;
                    }

                
                 
            }

            

            // allergens display

            // allergens list
            const productAllergens = document.querySelector(".allergens-list");

            productAllergens.innerHTML = "";
            // if no allergens are present for product display message
            if (allergens.length === 0){
                productAllergens.innerHTML = "<li>No allergens are present</li>";
            }

            else{
                // looping through each allergen
                allergens.forEach(alg => {
                    const list = document.createElement("li");

                    //allergen name and description
                    list.innerHTML = `
                    <span class="allergen-name">${alg.name}</span>
                    ${alg.description ? " - Description: " + alg.description : ""}`;

                    productAllergens.appendChild(list);

                });

            }

            

            console.log(product)

            
        } catch (error){
            console.error("error loading product details", error);
        }
    }
    // run ProductDetail function on page load
    document.addEventListener("DOMContentLoaded", ProductDetails);


</script>

{% endblock%}
