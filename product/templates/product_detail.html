{% if user.is_authenticated %}
<form method="POST" action="{% url 'shopping_cart:add_to_cart' product.product_id %}">
    {% csrf_token %}
    <button type="submit" class="btn-add-cart">
        <i class="fa fa-shopping-cart"></i> Add to Cart
    </button>
</form>
{% else %}
<p><a href="{% url 'user_accounts:login_page' %}">Login</a> to add this product to your cart</p>
{% endif %}
