<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

{%extends "base.html"%}

{% load static %}

{% block head %}

    {{ block.super }}
    <link rel="stylesheet" href="{% static 'product_detail.css' %}">
    
{% endblock %}


{% block content%}
 <!--<img src="/static/images/organic.png" class="organic-badge" style="display:;">-->

<div class="product-detail-container">
    <div class="product-image-container">
        <img  class="product-detail-img" src="" alt="product image">
    </div>

      
       
    
    <div class="product-info-container">
        <div class="product-box product-details-box"
        id="productDetailCard"
        data-product-id=""
        data-max-stock="0">

        
            <h3 class="product-name"></h3>
            <div class="product-rating"></div>
            <h4 class="product-price"></h4>
            <h4 class="product-producer"></h4>
            <h4 class="product-description"></h4>
            
            <!-- Micaiah added add to cart logic -->
            <div class="button-group" id="detailButtonGroup">
                <div class="quantity">
                    <button class="minus" type="button">-</button>
                    <input type="number" class="quantity-input" value="1" min="1">
                    <button class="plus" type="button">+</button>
                </div>

                <button class="add-cart" type="button">Add to Cart</button>
            </div>

            <button class="notify-btn" style="display:none;">
                <i class="fa-regular fa-bell"></i> Notify when available
            </button>


        </div>

        <div class="product-box farm-miles-box">
            <h4 class="farm-miles">Farm Miles</h4>
        </div>


        <div class="product-box allergens-box">
            <h3>Allergens</h3>
            <ul class="allergens-list"></ul>
        </div>


       

        </div>
            

    </div>

</div>

<div class="reviews-box">
            <h2>Customer Reviews</h2>
            <div class="review-filter">
                <label for="filterReviews">Filter reviews:</label>
                <select id="filterReviews">
                    <option value="recent">Most Recent</option>
                    <option value="highest">Highest Rating</option>
                    <option value="lowest">Lowest Rating </option>

                </select>
            </div>
            <div class="reviews-list"></div>

<!-- Stock alert -->
<div id="stockAlertModal" class="modal" style="display: none;">
    <div class="modal-content stock-alert-content">
        <div class="modal-header">
            <h2>Get Notified</h2>
            <span class="close-modal" onclick="closeStockAlertModal()">&times;</span>
        </div>

        <div class="modal-body">
            <p id="modal-product-name"></p>

            <div class="quantity-selector">
                <label for="alert-quantity">Quantity:</label>
                <div class="quantity-input-group">
                    <button type="button" class="quantity-btn" onclick="decrementAlertQuantity()">-</button>
                    <input type="number" id="alert-quantity" value="1" min="1" max="99">
                    <button type="button" class="quantity-btn" onclick="incrementAlertQuantity()">+</button>
                </div>
            </div>
        </div>

        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeStockAlertModal()">Cancel</button>
            <button class="btn-confirm" onclick="confirmStockAlert()">Notify Me</button>
        </div>
    </div>
</div>
{%endblock%}

{% block scripts%}

<script>
    

    

    let allReviews = [];


    //function for auth token
    function getToken(){
        // checking local storage and session storage
        return localStorage.getItem("access") || sessionStorage.getItem("access");

    }

    

    // variable to store product_id
    const productId = "{{product_id}}";

    // mapping allergens
    const allergenMap = {
        {% for allergen in allergens%}
        "{{ allergen.allergen_id}}" : "{{allergen.name}}"
        {%endfor%}
    };
    



    // function to fetch product details from api
    async function ProductDetails(){
        // get auth token
        const token = getToken();

        try {
            // try request to api to fetch product details
            const response = await fetch(`/customer/home/api/product/${productId}/`, {
                headers:{
                    "Authorization": "Bearer " + token
                }
            });

            // otherwise show error response
            if (!response.ok){
                console.error("error loading product");
                return;
            }

            
            // covert the response to json
            const data = await response.json();
            const product = data.product;
            const card = document.getElementById("productDetailCard");
            card.dataset.productId = product.product_id;
            card.dataset.maxStock = product.stock_quantity || 0;

            const availableStock = Number(product.available_stock ?? product.stock_quantity ?? 0);
            const canBuy = product.can_buy === true;

            const buttonGroup = document.getElementById("detailButtonGroup");
            const addCartBtn = document.querySelector(".add-cart");
            const notifyBtn = document.querySelector(".notify-btn");

            if (!canBuy) {
                card.classList.add("unavailable-product");
                addCartBtn.disabled = true;
                addCartBtn.textContent = "Unavailable";

                if (availableStock <= 0) {
                    notifyBtn.style.display = "block";
                } else {
                    notifyBtn.style.display = "none";
                }

                if (product.unavailable_reason) {
                    buttonGroup.insertAdjacentHTML(
                        "beforebegin",
                        `<p class="status-out-of-stock">${product.unavailable_reason}</p>`
                    );
                }
            } else {
                addCartBtn.disabled = false;
                addCartBtn.textContent = "Add to Cart";
                notifyBtn.style.display = "none";
            }
            const allergens = data.allergens || [];
            allReviews = data.reviews || [];
            allReviews.sort((a,b) => new Date(b.date)- new Date(a.date));
           

            displayReviews(allReviews);
                
            const ratingBox = document.querySelector(".product-rating");

            if (product.average_rating){
                ratingBox.innerHTML = `
                ${Number(product.average_rating).toFixed(1)}
                <i class="fa-solid fa-star"></i>`
            }

            // inserting product name, description and producer name into page
            //document.querySelector(".product-name").textContent = "Product: " + product.name;
            document.querySelector(".product-name").textContent = product.name;
            // Micaiah added surplus discount
            const descriptionEl = document.querySelector(".product-description");

            //descriptionEl.innerHTML = `Product description: ${product.description || ""}`;
            // Micaiah changed layout
            descriptionEl.innerHTML = `
                <span class="section-label">Description</span>
                <p>${product.description || "No description available."}</p>
            `;
            if (product.best_before_date) {
                descriptionEl.innerHTML += `
                    <div class="product-meta-row">
                        <span>Best before</span>
                        <strong>${new Date(product.best_before_date + "T00:00:00").toLocaleDateString('en-GB', {
                            day: '2-digit',
                            month: 'short',
                            year: 'numeric'
                        })}</strong>
                    </div>
                `;
            }

            if (product.surplus_note) {
                descriptionEl.innerHTML += `
                    <div class="product-meta-row">
                        <span>Why reduced?</span>
                        <strong>${product.surplus_note}</strong>
                    </div>
                `;
            }

            if (product.surplus_expiry_date) {
                descriptionEl.innerHTML += `
                    <div class="product-meta-row deal-ending">
                        <span>Deal ends</span>
                        <strong>${new Date(product.surplus_expiry_date).toLocaleString('en-GB', {
                            day: '2-digit',
                            month: 'short',
                            year: 'numeric',
                            hour: '2-digit',
                            minute: '2-digit'
                        })}</strong>
                    </div>
                `;
            }

            // document.querySelector(".product-price").textContent = "Price: £" + product.price;
            // Micaiah added surplus discount 
            if (product.has_surplus_discount) {
                document.querySelector(".product-price").innerHTML = `
                    <div class="price-line">
                        <span class="old-price">£${Number(product.original_price).toFixed(2)}</span>
                        <span class="current-price">£${Number(product.discounted_price).toFixed(2)}</span>
                        <span class="discount-badge">${product.discount_percentage}% off</span>
                    </div>
                `;
            } else {
                document.querySelector(".product-price").innerHTML = `
                    <span class="current-price">£${Number(product.price).toFixed(2)}</span>
                `;
            }
            // felna - bulk discount hint (community/restaurant only)
            if (
                data.is_bulk_eligible &&
                data.producer_bulk_threshold_quantity &&
                data.producer_bulk_discount_percentage &&
                !product.has_surplus_discount
            ) {
                const threshold = data.producer_bulk_threshold_quantity;
                const pct = parseFloat(data.producer_bulk_discount_percentage);
                const pctDisplay = pct % 1 === 0 ? pct.toFixed(0) : pct.toFixed(2);

                document.querySelector(".product-price").innerHTML += `
                    <div class="bulk-hint" style="
                        margin-top: 8px;
                        padding: 6px 10px;
                        background: #e8f5e9;
                        color: #2e7d32;
                        border-left: 3px solid #2e7d32;
                        border-radius: 4px;
                        font-size: 13px;
                        font-weight: 600;
                        display: inline-block;
                    ">
                        <i class="fa-solid fa-tag"></i>
                        Buy ${threshold}+ and save ${pctDisplay}%
                    </div>
                `;
            }
            // end felna
            
            //document.querySelector(".product-producer").textContent = "Producer: " + product.producer_name;
            // Micaiah fixed layout 
            document.querySelector(".product-producer").innerHTML = `
                Sold by <strong>${product.producer_name}</strong>
            `;
            const image = document.querySelector(".product-detail-img");

            // if theres an image display it too
            if (product.image){
                image.src = product.image;
            }

            if(data.farm_miles !== null){  
                const farmMiles = document.querySelector(".farm-miles");

                if (data.farm_miles <= 20) {
                    farmMiles.innerHTML = `
                    
                    <i class="fa-solid fa-car"></i>
                    Farm miles: ${data.farm_miles} miles
                    <br>

                    
                    <i class="fa-regular fa-face-smile"></i>
                    Great news! This product is within our 20 mile producer to customer commitment.
                   
                    `;

                }else{
                        farmMiles.innerHTML = `
                        Farm miles: ${data.farm_miles} miles
                        <i class="fa-solid fa-triangle-exclamation"></i>
                        This product is over 20 miles away. Consider browsing more local producers.
                        
                        `;
                    }

                
                 
            }
            

            

            // allergens display

            // allergens list
            const productAllergens = document.querySelector(".allergens-list");

            productAllergens.innerHTML = "";
            // if no allergens are present for product display message
            if (allergens.length === 0){
                productAllergens.innerHTML = "<li>No allergens are present</li>";
            }

            else{
                // looping through each allergen
                allergens.forEach(alg => {
                    const list = document.createElement("li");

                    //allergen name and description
                    list.innerHTML = `
                    <span class="allergen-name">${alg.name}</span>
                    ${alg.description ? " - Description: " + alg.description : ""}`;

                    productAllergens.appendChild(list);

                });

            }
            

            const plusBtn = document.querySelector(".plus");
            const minusBtn = document.querySelector(".minus");
            // const quantityDisplay = document.querySelector(".quantity-display");
            const quantityInput = document.querySelector(".quantity-input");
            plusBtn.onclick = function(e) {
                e.preventDefault();

                const currentQty = parseInt(quantityInput.value) || 1;
                const maxStock = Number(product.available_stock ?? product.stock_quantity ?? 0);

                if (currentQty < maxStock) {
                    quantityInput.value = currentQty + 1;
                } else {
                    showNotification(`Only ${maxStock} items available in stock`, "error");
                }
            };

            minusBtn.onclick = function(e) {
                e.preventDefault();

                const currentQty = parseInt(quantityInput.value) || 1;

                if (currentQty > 1) {
                    quantityInput.value = currentQty - 1;
                }
            };

            quantityInput?.addEventListener("input", function () {
                const maxStock = Number(product.available_stock ?? product.stock_quantity ?? 0);

                if (this.value === "") return;

                let value = parseInt(this.value);

                if (value < 1) {
                    this.value = 1;
                    return;
                }

                if (value > maxStock) {
                    this.value = maxStock;
                    showNotification(`Only ${maxStock} items available in stock`, "error");
                }
            });

            quantityInput?.addEventListener("blur", function () {
                if (this.value === "" || parseInt(this.value) < 1) {
                    this.value = 1;
                }
            });

            addCartBtn.onclick = function(e) {
                e.preventDefault();

                const quantity = parseInt(quantityInput.value) || 1;
                addToCart(product.product_id, quantity, addCartBtn);
            };

            notifyBtn.onclick = function(e) {
                e.preventDefault();
                showStockAlert(e, product.product_id, product.name);
            };
            

            console.log(product)

            
        } catch (error){
            console.error("error loading product details", error);
        }
    }


function displayReviews(reviews){

    const productReviews = document.querySelector(".reviews-list");
    productReviews.innerHTML = "";

    if (reviews.length === 0){
        productReviews.innerHTML = "<p>There are no reviews for this product yet</p>"
        return;

    }


    reviews.forEach(r => {
                    const div = document.createElement("div");
                    div.classList.add("review-item");

                    div.innerHTML = `
                     
                        
                    <div class="review-header">
                    <span class="review-name">${r.customer}</span>

                    <button class="delete-review"
                    onclick="deleteReview(${r.review_id})">
                    <i class="fa-solid fa-trash-can"></i>
                    </button>
 

                    <span class="verified-badge">
                        <i class="fa-solid fa-bag-shopping"></i>
                        </span>
                        
                       

                    </div>

                    <div class="stars">
                    Rating: ${'<i class="fa-solid fa-star"></i>'.repeat(r.rating)}
                    </div>

                    <p class="review-text">${r.text}</p>
                    <div class="review-date">
                    Date of review: ${new Date(r.date).toLocaleDateString()}
                    </div>
                    `;
                    productReviews.appendChild(div);
                })
            }

    




let reviewDelete = null;

function deleteReview(reviewId){

    reviewDelete = reviewId;
    document.getElementById("deleteReviewPopup").style.display = "flex";
}

function closeDeletePopup(){

    document.getElementById("deleteReviewPopup").style.display = "none";

}

function closeSuccessPopup(){
    document.getElementById("successPopup").style.display = "none";
    location.reload();
}



function confirmDeleteReview(){

    fetch(`/orders/delete-review/${reviewDelete}/`, {
        method: "POST",
        headers: {
            'X-CSRFToken': '{{ csrf_token }}',
            'Content-Type': 'application/json'
        }
    })
        .then( response =>  response.json())
        .then(data => {
            closeDeletePopup();
            document.getElementById("successPopup").style.display = "flex";
        })

      
           

        .catch(error => {
            console.error("delete failed:", error)
        });

     
}

    // run ProductDetail function on page load
    document.addEventListener("DOMContentLoaded", ProductDetails);


document.addEventListener("DOMContentLoaded", function(){


    document.getElementById("filterReviews").addEventListener("change", function (){
        let sorted = [...allReviews];

        if (this.value === "recent"){
            sorted.sort((a,b) => new Date(b.date) - new Date(a.date));
        }

        if (this.value === "highest"){
            sorted.sort((a,b) => b.rating - a.rating);
        }

        if (this.value === "lowest"){
            sorted.sort((a,b) => a.rating - b.rating);
        }

        displayReviews(sorted);

});


});

function showNotification(message, type) {
    const existing = document.querySelector('.notification');
    if (existing) existing.remove();

    const notification = document.createElement('div');
    notification.className = `notification ${type}`;
    notification.innerHTML = `
        <span>${message}</span>
        <button onclick="this.parentElement.remove()">×</button>
    `;

    document.body.appendChild(notification);
    setTimeout(() => notification.remove(), 3000);
}

function updateCartBadge(count) {
    const badge = document.getElementById('cart-badge');
    if (badge) {
        if (count > 0) {
            badge.textContent = count;
            badge.style.display = 'flex';
        } else {
            badge.style.display = 'none';
        }
    }
}

function addToCart(productId, quantity = 1, button) {
    const token = getToken();

    if (!token) {
        window.location.href = "/login/";
        return;
    }

    if (button) {
        button.textContent = "Adding...";
        button.disabled = true;
    }

    fetch("/cart/api/add/", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + token
        },
        body: JSON.stringify({
            product_id: parseInt(productId),
            quantity: quantity
        })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            showNotification(data.message, "success");
            updateCartBadge(data.cart_total_items);

            const input = document.querySelector(".quantity-input");
            if (input) input.value = "1";
        } else {
            showNotification(data.error || "Could not add to cart", "error");
        }
    })
    .catch(() => {
        showNotification("Something went wrong", "error");
    })
    .finally(() => {
        if (button) {
            button.textContent = "Add to Cart";
            button.disabled = false;
        }
    });
}
let currentProductId = null;
let currentProductName = "";

function showStockAlert(event, productId, productName) {
    event.preventDefault();

    currentProductId = productId;
    currentProductName = productName;

    //const quantityDisplay = document.querySelector(".quantity-display");
    // const quantityInput = document.querySelector(".quantity-input");
    // const desiredQty = quantityDisplay ? parseInt(quantityDisplay.textContent) : 1;
    const quantityInput = document.querySelector(".quantity-input");
    const desiredQty = quantityInput ? parseInt(quantityInput.value) || 1 : 1;
    const card = document.getElementById("productDetailCard");
    const maxStock = parseInt(card?.dataset.maxStock) || 99;

    const input = document.getElementById("alert-quantity");
    input.max = maxStock;
    input.dataset.maxStock = maxStock;
    input.value = Math.min(desiredQty, maxStock);

    document.getElementById("modal-product-name").innerHTML =
        `How many ${productName} would you like to be notified about?<br>
        <small style="color:#666;">Current total stock: ${maxStock}</small>`;

    document.getElementById("stockAlertModal").style.display = "flex";
}

function closeStockAlertModal() {
    document.getElementById("stockAlertModal").style.display = "none";
}

function incrementAlertQuantity() {
    const input = document.getElementById("alert-quantity");
    const maxStock = parseInt(input.dataset.maxStock) || 99;
    let value = parseInt(input.value) || 1;

    if (value < maxStock) {
        input.value = value + 1;
    }
}

function decrementAlertQuantity() {
    const input = document.getElementById("alert-quantity");
    let value = parseInt(input.value) || 1;

    if (value > 1) {
        input.value = value - 1;
    }
}

function confirmStockAlert() {
    const quantity = parseInt(document.getElementById("alert-quantity").value);

    closeStockAlertModal();

    if (isNaN(quantity) || quantity < 1) {
        showNotification("Please enter a valid quantity", "error");
        return;
    }

    createStockAlert(currentProductId, quantity, currentProductName);
}
async function createStockAlert(productId, quantity, productName) {
    const token = getToken();

    if (!token) {
        window.location.href = "/login/";
        return;
    }

    try {
        const response = await fetch("/notifications/api/alerts/create/", {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + token
            },
            body: JSON.stringify({
                product_id: productId,
                quantity: quantity
            })
        });

        const data = await response.json();

        if (data.success) {
            showNotification(`You'll be notified when ${productName} is available`, "success");
        } else {
            showNotification(data.error || "Could not create alert", "error");
        }
    } catch (error) {
        showNotification("Something went wrong", "error");
    }
}



</script>

<div id="deleteReviewPopup" class="remove-item">
    <div class="remove-box">
        <h3>Delete Your Review?</h3>
        
        <div class="removal-actions">
            <button onclick="confirmDeleteReview()">Delete</button>
            <button onclick="closeDeletePopup()">Cancel</button>

        </div>
    </div>
</div>

<div id="successPopup" class="remove-item">
    <div class="remove-box">
        
        
        <div class="removal-actions">
            <button onclick="closeSuccessPopup()">Review Deleted</button>
           

        </div>
    </div>
</div>



{% endblock%}
