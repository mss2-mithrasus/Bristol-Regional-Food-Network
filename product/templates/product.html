{% block scripts %}
<script>
    function getToken() {
        return localStorage.getItem("access") || sessionStorage.getItem("access");
    }

    // function for search query to load products
    function getQuery(name) {
        const params = new URLSearchParams(window.location.search)
        return params.get(name)

    }

    // listener for when search is submitted
    document.getElementById("searchForm").addEventListener("submit", function(e){
        // prevent refresh during search
        e.preventDefault();

        //search bar query
        const query = document.querySelector(".search-bar").value.trim();
        const titleEL = document.querySelector(".category-title");
        if (titleEL){
            //display search title
            if (query) titleEL.textContent = `Search results for "${query}"`;
        }
        // search bar filter drop down
        const filter = document.getElementById("organic-filter").value;

        const newUrl = new URL(window.location);
        newUrl.searchParams.set("q", query);

        // if filter is picked apply it
        if (filter) newUrl.searchParams.set("filter", filter);
        else newUrl.searchParams.delete("filter");

        window.history.pushState({}, "", newUrl);

        //passing query and filter to load products
        loadProducts(query, filter);
    })
    
    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    
    if (!getToken) {
        window.location.href = "/login/";
    }

        const token = getToken();
        try{
            const response = await fetch("/customer/home/api/customer/", {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });

            if (!response.ok){
                const text = await response.text();
                console.error("server error", text)
                return;
            }

            const data = await response.json();

            // display categories on page
            getCategories(data.categories);
            
        } catch (error) {
            console.error("Error loading data", error);
        }
        

    }

        const query = getQuery("q");

        const selectedFilter = getQuery("filter");

        fetch("/customer/home/api/customer/", {

        .then(data => {
             getCategories(data.categories);

})
        
    //function to get categories from backend and display as category cards
    function getCategories(categories){
        const data = document.querySelector(".category");
        const titleEL = document.querySelector(".category-title");

        if (!data) return;

        data.innerHTML = "";

        // looping through categories
        categories.forEach(category => {
            const card = document.createElement("a");
            card.className = "category-card";
            // category link
            //card.href = `/customer/home/category/${encodeURIComponent(category.category_name)}`;
            card.href = `/customer/home/category/${encodeURIComponent(category.category_name)}/`;
            card.innerHTML = ` <img src="/static/${category.image}" alt="${category.category_name}">
            <p>${category.category_name}</p>`;

            // load products when category is clicked
            // card.addEventListener("click", function(e){
            //     e.preventDefault();
            //     titleEL.textContent = category.category_name;
            //     //loading products for that category
            //     loadProducts("", "", category.category_name);
            // });

            // Micaiah changed to fix redirect issue
            card.addEventListener("click", function(e){
                e.preventDefault();
                window.location.href = `/customer/home/category/${encodeURIComponent(category.category_name)}/`;
            });
            data.appendChild(card); 
        })

    }

    // loading products from api using the query, filter, category
    async function loadProducts(query, filter="", category=""){
        const token = getToken();
        if (!token) return;

        //api url
        let url = `/customer/home/api/products/?q=${encodeURIComponent(query)}`;
        // if filter selected use it
        if (filter) url += `&filter=${encodeURIComponent(filter)}`;

        // if category selected use it
        if (category) {
            url += `&category=${encodeURIComponent(category)}`;
        }

        try{
            // try request products from api
            const response = await fetch(url, {
                headers: {
                    "Authorization": "Bearer " + token
                }
            });
            // if failed display error
            if (!response.ok){
                console.error("error loading products");
                return;
            }

            const data = await response.json();

            // if there are products display them
            if (data.products && data.products.length > 0){
                // hide categories when displaying products
                    document.querySelector(".category").style.display = "none";
                    // display products
                    getProducts(data.products);
                } else {
                    // if no products show message
                    document.querySelector(".category").style.display = "none"
                    document.querySelector(".product-container").innerHTML = "<p>No products found</p>";

                }
            } catch (error){
                console.error("error getting products", error);
                
        }

    }

    // function to create product cards
    function getProducts(products){
        const data = document.querySelector(".product-container");
        

        if (!data) return;

        // clear products
        data.innerHTML = "";

        // loop through each product
        products.forEach(product => {

            let seasonalData = "";
            let seasonBadge = "";

            // seasonal availability info
            const seasons = product.seasonal_availability || [];

            if (seasons.length > 0) {
                const season = seasons[0];
            
            // if product has yearly availability display this

                seasonalData = `<h4 class="field"><span class="label">Season:</span> All Year</h4>`;
                seasonBadge = `<i class="fa-solid fa-seedling season badge"></i>`;
                outOfSeason = false;
            } else if (season.season_start_date && season.season_end_date){

                const endDate = new Date(season.season_end_date + "T00:00:00")
                const today = new Date();
                

                // out of season if todays date is not within the start or end date
                if (today < startDate|| today > endDate) outOfSeason = true;

                // coverting dates to month
                const start_season_month = startDate.toLocaleString('default', {month: 'long'});
                const end_season_month = endDate.toLocaleString('default', {month: 'long'});
                
                seasonalData = `<h4 class="field"><span class="label">Season</span> ${start_season_month} - ${end_season_month}</h4>`;
                // show in season badge if not out of season
                if (!outOfSeason){
                    seasonBadge = `<i class="fa-solid fa-seedling season-badge"></i>`;
                }
            
                
        }
        console.log(product.name, seasonalData);
    }
            // show organic badge only is product is organic certified
            const organic = product.organic_certified ?
              `<img src="/static/images/organic.png" class="organic-badge">` : "";
                        
            // const status = product.availability_status ? 
            //  `<span class="status-available">Available</span>`

            const availableStock = Number(product.available_stock ?? product.stock_quantity ?? 0);
            //const canBuy = availableStock > 0 && product.is_valid_for_fulfilment;
            const canBuy = product.can_buy === true;
            const status = canBuy
                ? `<span class="status-available">Available</span>`
                : `<span class="status-out-of-stock">${product.unavailable_reason || "Unavailable"}</span>`;
            // Micaiah added surplus discount 
            const priceHtml = product.has_surplus_discount
                ? `
                    <h4 class="field">
                        <span class="label">Price:</span>
                        <span style="text-decoration: line-through; color:#777;">
                            £${Number(product.original_price).toFixed(2)}
                        </span>
                        <strong style="color:#c62828;">
                            £${Number(product.discounted_price).toFixed(2)}
                        </strong>
                    </h4>

                    <div style="margin:8px 0;">
                        <span style="background:#ffe5e5; color:#c62828; padding:4px 8px; border-radius:10px; font-size:12px; font-weight:bold;">
                            ${product.discount_percentage}% OFF
                        </span>
                    </div>

                    ${product.surplus_note ? `
                        <p style="font-size:13px; color:black;">
                            <strong>Discount Reason:</strong>
                            ${product.surplus_note}
                        </p>
                    ` : ""}

                    ${product.surplus_expiry_date ? `
                        <p style="font-size:13px; color:#b26a00;">
                            <strong>Surplus Deal Ends:</strong>
                            ${new Date(product.surplus_expiry_date).toLocaleString('en-GB', {
                                day: '2-digit',
                                month: 'short',
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            })}

                    ` : ""}
                `
                : `
                    <h4 class="field">
                        <span class="label">Price:</span> £${Number(product.price).toFixed(2)}
                    </h4>
                `;
            // Micaiah added best before date
            const bestBeforeHtml = product.best_before_date
                ? `
                    <h4 class="field">
                        <span class="label">Best before:</span>
                        ${new Date(product.best_before_date + "T00:00:00").toLocaleDateString('en-GB', {
                            day: '2-digit',
                            month: 'short',
                            year: 'numeric'
                        })}
                    </h4>
                `
                : "";
            const card = document.createElement("div");
            card.className = "product-card" + (outOfSeason ? " out-of-season" : "");
            card.dataset.productId = product.product_id;
            card.dataset.maxStock = product.stock_quantity || 0;
            if (!canBuy) {
                card.classList.add("unavailable-product");
            }
            card.innerHTML = ` <img src="${product.image? product.image : '/static/images/default-product.png'}">

            <div class="field-row">
                        <h4 class="field"><span class="label">Product:</span> ${product.name}</h4>
                        ${organic}
                        ${seasonBadge}
                    </div>

                    <h4 class="field"><span class="label">Producer:</span> ${product.producer_name}</h4>
                    ${priceHtml}
                    ${bestBeforeHtml}
                    ${seasonalData}

                    <div class="status-section">
                        <h4 class="field"><span class="label">Status:</span> ${status}
                            
                        </h4>
                    </div>




                    <div class="button-group">
                        <div class="quantity ${!canBuy ? "quantity-disabled" : ""}">
                            <button class="minus" ${!canBuy ? "disabled" : ""}>-</button>
                            <span class="quantity-display">1</span>
                            <button class="plus" ${!canBuy ? "disabled" : ""}>+</button>
                        </div>
                        <button class="add-cart" ${!canBuy ? "disabled" : ""}>
                            ${canBuy ? "Add to Cart" : "Unavailable"}
                        </button>
                    </div>


                    <button class="notify-btn"
                            data-product-id="${product.product_id }"
                            onclick="showStockAlert(event, ${product.product_id}, '${product.name}')"
                            style="${availableStock <= 0 ? 'display:block;' : 'display:none;'}">
                        <i class="fa-regular fa-bell"></i> Notify when available
                    </button>


                    <a href="/customer/home/product/${product.product_id}/?next=${encodeURIComponent(window.location.pathname + window.location.search)}" class="product-details">

            data.appendChild(card);

                    e.preventDefault();
                    const display = card.querySelector('.quantity-display');

                    const productId = card.dataset.productId;
                    if (display) {
                        const currentQty = parseInt(display.textContent);
                    if (currentQty < maxStock) {
                        display.textContent = currentQty + 1;
                        // Update notify button after quantity changes
                        updateNotifyButton(card, productId);
                    } else {
                        showNotification(`Only ${maxStock} items available in stock`, 'error');
                    }
                    }
                });

            }
            
            
            const minusBtn = card.querySelector('.minus');
            if (minusBtn) {
                minusBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const display = card.querySelector('.quantity-display');
                    const productId = card.dataset.productId;
                    if (display) {
                        let currentQty = parseInt(display.textContent);
                        if (currentQty > 1){
                            display.textContent = currentQty - 1;
                            // Update notify button after quantity decreases
                            updateNotifyButton(card, productId);
                        }
                    }
                });

            }
            
            
            const addToCartBtn = card.querySelector('.add-cart');
            if (addToCartBtn) {
                addToCartBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const productId = card.dataset.productId;
                    if (!productId) {
                        showNotification('Error: Product ID not found', 'error');
                        return;
                    }
                    const quantityDisplay = card.querySelector('.quantity-display');
                    const quantity = quantityDisplay ? parseInt(quantityDisplay.textContent) : 1;
                    addToCart(productId, quantity, this);
                });
            }
        });
        

    }
    
    function goToCartWithToken(event) {
        event.preventDefault();
        const token = getToken();
        if (!token) {
            window.location.href = "/login/";
            return;
        }
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/cart/';
        
        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = 'csrfmiddlewaretoken';
        csrfInput.value = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
        
        const tokenInput = document.createElement('input');
        tokenInput.type = 'hidden';
        tokenInput.name = 'token';
        tokenInput.value = token;
        
        form.appendChild(csrfInput);
        form.appendChild(tokenInput);
        document.body.appendChild(form);
        form.submit();
    }
    
    function showNotification(message, type) {
        const existing = document.querySelector('.notification');
        if (existing) existing.remove();
        
        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.style.position = 'fixed';
        notification.style.top = '20px';
        notification.style.right = '20px';
        notification.style.padding = '15px 25px';
        notification.style.background = 'white';
        notification.style.borderRadius = '6px';
        notification.style.boxShadow = '0 4px 12px rgba(0,0,0,0.15)';
        notification.style.zIndex = '1000';
        notification.style.display = 'flex';
        notification.style.alignItems = 'center';
        notification.style.gap = '15px';
        notification.style.animation = 'slideIn 0.3s';
        notification.style.borderLeft = `4px solid ${type === 'success' ? '#28a745' : '#dc3545'}`;
        
        notification.innerHTML = `
            <span>${message}</span>
            <button onclick="this.parentElement.remove()" style="background: none; border: none; font-size: 20px; cursor: pointer; color: #999;">×</button>
        `;
        
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
    }
    
    function updateCartBadge(count) {
        const badge = document.getElementById('cart-badge');
        if (badge) {
            if (count > 0) {
                badge.textContent = count;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }
    }
    
    function addToCart(productId, quantity = 1, button) {
        const token = getToken();
        if (!token) {
            showNotification('Please log in', 'error');
            window.location.href = '/login/';
            return;
        }
        
        if (button) {
            button.textContent = 'Adding...';
            button.disabled = true;
        }
        
        fetch('/cart/api/add/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + token
            },
            body: JSON.stringify({
                product_id: parseInt(productId),
                quantity: quantity
            })
        })
        .then(response => {
            if (response.status === 401) throw new Error('Session expired');
            return response.json();
        })
        .then(data => {
            if (data.success) {
                showNotification(data.message, 'success');
                updateCartBadge(data.cart_total_items);
                const display = button?.closest('.product-card')?.querySelector('.quantity-display');
                if (display) display.textContent = '1';
            } else {
                showNotification('Error: ' + (data.error || 'Could not add to cart'), 'error');
            }
        })
        .catch(error => {
            showNotification(error.message, 'error');
            if (error.message === 'Session expired') {
                setTimeout(() => window.location.href = '/login/', 2000);
            }
        })
        .finally(() => {
            if (button) {
                button.textContent = 'Add to Cart';
                button.disabled = false;
            }
        });
    }

    async function checkProductAvailability(productId) {
        const token = getToken();
        if (!token) return { isAvailable: false, available: 0 };
        try {
            const response = await fetch(`/cart/api/check-availability/${productId}/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            return {
                isAvailable: data.is_available_to_user,
                available: data.available
            };
        } catch (error) {
            console.error('Error checking availability:', error);
            return { isAvailable: false, available: 0 };
        }
    }

    async function updateNotifyButton(card, productId) {
        const token = getToken();
        if (!token) return;
        
        try {
            const quantityDisplay = card.querySelector('.quantity-display');
            const desiredQty = quantityDisplay ? parseInt(quantityDisplay.textContent) : 1;
            
            // Call the real-time availability API
            const response = await fetch(`/cart/api/check-availability/${productId}/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            const available = data.available ?? 0;
            
            const notifyBtn = card.querySelector('.notify-btn');
            if (notifyBtn) {
                if (desiredQty > available) {
                    notifyBtn.style.display = 'block';
                    notifyBtn.setAttribute('data-desired-qty', desiredQty);
                } else {
                    notifyBtn.style.display = 'none';
                }
            }
        } catch (error) {
            console.error('Error updating notify button:', error);
        }
    }

    // Stock Alert Modal Variables
    let currentProductId = null;
    let currentProductName = '';

    function showStockAlert(event, productId, productName) {
        currentProductId = productId;
        currentProductName = productName;
        
        // Get the quantity from the product card
        const card = event?.target?.closest('.product-card');
        const quantityDisplay = card?.querySelector('.quantity-display');
        const desiredQty = quantityDisplay ? parseInt(quantityDisplay.textContent) : 1;
        const maxStock = parseInt(card?.dataset.maxStock) || 99; // Get total stock

        // Store max stock in a data attribute or variable
        document.getElementById('alert-quantity').max = maxStock;
        document.getElementById('alert-quantity').dataset.maxStock = maxStock;
        document.getElementById('modal-product-name').innerHTML = 
            `How many ${productName} would you like to be notified about?<br>
            <small style="color:#666;">Current total stock: ${maxStock}</small>`;
        document.getElementById('alert-quantity').value = Math.min(desiredQty, maxStock);
        document.getElementById('stockAlertModal').style.display = 'flex';
    }
    function closeStockAlertModal() {
        document.getElementById('stockAlertModal').style.display = 'none';
    }

    function incrementAlertQuantity() {
        const input = document.getElementById('alert-quantity');
        const maxStock = parseInt(input.dataset.maxStock) || 99;
        let value = parseInt(input.value) || 1;
        if (value < maxStock) {
            input.value = value + 1;
        }
    }

    function decrementAlertQuantity() {
        const input = document.getElementById('alert-quantity');
        let value = parseInt(input.value) || 1;
        if (value > 1) {
            input.value = value - 1;
        }
    }

    function confirmStockAlert() {
        const quantity = parseInt(document.getElementById('alert-quantity').value);
        closeStockAlertModal();
        if (isNaN(quantity) || quantity < 1) {
            showNotification('Please enter a valid quantity', 'error');
            return;
        }
        createStockAlert(currentProductId, quantity, currentProductName);
    }

    window.onclick = function(event) {
        const modal = document.getElementById('stockAlertModal');
        if (event.target === modal) closeStockAlertModal();
    }

    async function createStockAlert(productId, quantity, productName) {
        const token = getToken();
        if (!token) { window.location.href = "/login/"; return; }
        try {
            const response = await fetch('/notifications/api/alerts/create/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ product_id: productId, quantity: quantity })
            });
            const data = await response.json();
            if (data.success) {
                showNotification(` You'll be notified when ${productName} is available`, 'success');
            } else {
                showNotification('Error: ' + (data.error || 'Could not create alert'), 'error');
            }
        } catch (error) {
            showNotification('Something went wrong', 'error');
        }
    }
    
    
        
        
        // Get initial cart count
        const token = getToken();
        if (token) {
            fetch('/cart/api/icon/', {
                headers: { 'Authorization': 'Bearer ' + token }
            })
            .then(response => response.json())
            .then(data => { if (data.total_items > 0) updateCartBadge(data.total_items); })
            .catch(error => console.error('Error fetching cart count:', error));
        }
        // Poll for notification badge
        async function checkNotificationBadge() {
            const token = getToken();
            if (!token) return;
            try {
                const response = await fetchWithAuth('/notifications/api/unread-count/', {
                    
                });
                const data = await response.json();
                const badge = document.getElementById('notification-badge');
                if (badge) {
                    if (data.unread_count > 0) {
                        badge.textContent = data.unread_count;
                        badge.style.display = 'flex';
                    } else {
                        badge.style.display = 'none';
                    }
                }
            } catch (e) {}
        }
        checkNotificationBadge();
        setInterval(checkNotificationBadge, 3000);
        // Update notify buttons based on real-time availability
        document.querySelectorAll('.product-card').forEach(async card => {
            const productId = card.dataset.productId;
            if (productId) await updateNotifyButton(card, productId);
        });
    
    
    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to   { transform: translateX(0);    opacity: 1; }
        }
    `;
    document.head.appendChild(style);
    
    function logoutUser() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "/login/";
    }
</script>
