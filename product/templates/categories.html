{% extends "base.html" %}

{% load static %}

{% block head %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static 'categories.css' %}">
{% endblock %}

{% block content %}
<h2 class="category-title"></h2>

<div class="product-container">
    
</div>

<!-- Stock Alert Modal -->
<div id="stockAlertModal" class="modal" style="display: none;">
    <div class="modal-content">
        <div class="modal-header">
            <h2> Get Notified</h2>
            <span class="close-modal" onclick="closeStockAlertModal()">&times;</span>
        </div>
        <div class="modal-body">
            <p id="modal-product-name"></p>
            <div class="quantity-selector">
                <label for="alert-quantity">Quantity:</label>
                <div class="quantity-input-group">
                    <button type="button" class="quantity-btn" onclick="decrementAlertQuantity()">-</button>
                    <input type="number" id="alert-quantity" value="1" min="1" max="99">
                    <button type="button" class="quantity-btn" onclick="incrementAlertQuantity()">+</button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
            <button class="btn-cancel" onclick="closeStockAlertModal()">Cancel</button>
            <button class="btn-confirm" onclick="confirmStockAlert()">Notify Me</button>
        </div>
    </div>
</div>


</div>

<script>


   const categoryName = window.location.pathname.split('/').filter(Boolean).pop();

    
    function getToken() {
        return localStorage.getItem("access") || sessionStorage.getItem("access");
    }

    function getRefreshToken() {
        return localStorage.getItem("refresh") || sessionStorage.getItem("refresh");
    }

    function setToken(newAccess) {
        if (localStorage.getItem("access")) {
            localStorage.setItem("access", newAccess);
        } else {
            sessionStorage.setItem("access", newAccess);
        }
    }

    function goToCartWithToken(event) {
        event.preventDefault();
        const token = getToken();
        if (!token) {
            window.location.href = "/login/";
            return;
        }
        const form = document.createElement('form');
        form.method = 'POST';
        form.action = '/cart/';
        
        const csrfInput = document.createElement('input');
        csrfInput.type = 'hidden';
        csrfInput.name = 'csrfmiddlewaretoken';
        csrfInput.value = document.cookie.match(/csrftoken=([^;]+)/)?.[1] || '';
        
        const tokenInput = document.createElement('input');
        tokenInput.type = 'hidden';
        tokenInput.name = 'token';
        tokenInput.value = token;
        
        form.appendChild(csrfInput);
        form.appendChild(tokenInput);
        document.body.appendChild(form);
        form.submit();
    }

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            const cookies = document.cookie.split(';');
            for (let i = 0; i < cookies.length; i++) {
                const cookie = cookies[i].trim();
                if (cookie.substring(0, name.length + 1) === (name + '=')) {
                    cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                    break;
                }
            }
        }
        return cookieValue;
    }
    const csrftoken = getCookie('csrftoken');

    const token = getToken();
    if (!token) {
        window.location.href = "/login/";
    }

    async function refreshAccessToken() {
        const refresh = getRefreshToken();
        if (!refresh) throw new Error("No refresh token");

        const response = await fetch("/api/token/refresh/", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ refresh })
        });

        if (!response.ok) throw new Error("Refresh failed");

        const data = await response.json();
        setToken(data.access);
        return data.access;
    }

    async function fetchWithAuth(url, options = {}) {
        let token = getToken();

        options.headers = {
            ...options.headers,
            "Authorization": `Bearer ${token}`,
            "X-CSRFToken": csrftoken,
        };

        let response = await fetch(url, options);

        if (response.status === 401) {
            try {
                token = await refreshAccessToken();
                options.headers["Authorization"] = `Bearer ${token}`;
                response = await fetch(url, options);
            } catch (e) {
                window.location.href = "/login/";
                throw new Error("Session expired");
            }
        }

        return response;
    }

    function showNotification(message, type) {
        const existing = document.querySelector('.notification');
        if (existing) existing.remove();

        const notification = document.createElement('div');
        notification.className = `notification ${type}`;
        notification.innerHTML = `
            <span>${message}</span>
            <button onclick="this.parentElement.remove()">×</button>
        `;
        document.body.appendChild(notification);
        setTimeout(() => notification.remove(), 3000);
    }


    //loading products through API

    function getProducts(products){
        const data = document.querySelector(".product-container");
        

        if (!data) return;
        
        data.innerHTML = "";

        products.forEach(product => {

            let seasonalData = "";

        
            const seasons = product.seasonal_availability || [];

            if (seasons.length > 0) {
                const season = seasons[0];
            
            
            
            if (season.is_year_round){
                seasonalData = `<h4 class="field"><span class="label">Season:</span>All Year</h4>`;
            } else if (season.season_start_date && season.season_end_date){
                const start_season_month = new Date(season.season_start_date + "T00:00:00")
                    .toLocaleString('default', {month: 'long'});

                const end_season_month = new Date(season.season_end_date + "T00:00:00")
                    .toLocaleString('default', {month: 'long'});
                
                seasonalData = `<h4 class="field"><span class="label">In season</span> ${start_season_month} - ${end_season_month}</h4>`;
            
                
        }
        console.log(product.name, seasonalData);
    }


            const organic = product.organic_certified ?
              `<img src="/static/images/organic.png" class="organic-badge">` : "";
                        
            const status = product.availability_status ? 
             `<span class="status-available">Available</span>`
            : `<span class="status-out-of-stock">Out of stock</span>`;
            
            // Micaiah added surplus discount 

            const priceHtml = product.has_surplus_discount
                ? `
                    <h4 class="field">
                        <span class="label">Price:</span>
                        <span style="text-decoration: line-through; color:#777;">
                            £${Number(product.original_price).toFixed(2)}
                        </span>
                        <strong style="color:#c62828;">
                            £${Number(product.discounted_price).toFixed(2)}
                        </strong>
                    </h4>

                    <div style="margin:8px 0;">
                        <span style="background:#ffe5e5; color:#c62828; padding:4px 8px; border-radius:10px; font-size:12px; font-weight:bold;">
                            ${product.discount_percentage}% OFF
                        </span>
                    </div>

                    ${product.surplus_note ? `
                        <p style="font-size:13px; color:black;">
                            <strong>Discount Reason:</strong>
                            ${product.surplus_note}
                        </p>
                    ` : ""}

                    ${product.surplus_expiry_date ? `
                        <p style="font-size:13px; color:#b26a00;">
                            <strong>Surplus Deal Ends:</strong>
                            ${new Date(product.surplus_expiry_date).toLocaleString('en-GB', {
                                day: '2-digit',
                                month: 'short',
                                year: 'numeric',
                                hour: '2-digit',
                                minute: '2-digit'
                            })}
                        </p>
                    ` : ""}
                `
                : `
                    <h4 class="field">
                        <span class="label">Price:</span> £${Number(product.price).toFixed(2)}
                    </h4>
                `;
            // Micaiah added best before date
            const bestBeforeHtml = product.best_before_date
                ? `
                    <h4 class="field">
                        <span class="label">Best before:</span>
                        ${new Date(product.best_before_date + "T00:00:00").toLocaleDateString('en-GB', {
                            day: '2-digit',
                            month: 'short',
                            year: 'numeric'
                        })}
                    </h4>
                `
                : "";
            const card = document.createElement("div");
            card.className = "product-card";
            card.dataset.productId = product.product_id;
            card.dataset.maxStock = product.stock_quantity || 0;

            card.innerHTML = ` <img class="product-img" src="${product.image? product.image : '/static/images/default-product.png'}">

            <div class="field-row">
                        <h4 class="field"><span class="label">Product:</span> ${product.name}</h4>
                        ${organic}
                    </div>

                    <h4 class="field"><span class="label">Producer:</span> ${product.producer_name}</h4>
                    ${priceHtml}
                    ${bestBeforeHtml}                 
                    ${seasonalData}

                    <div class="status-section">
                        <h4 class="field"><span class="label">Status:</span> ${status}
                            
                        </h4>
                    </div>




                    <div class="button-group">
                        <div class="quantity">
                            <button class="minus">-</button>
                            <span class="quantity-display">1</span>
                            <button class="plus">+</button>
                        </div>
                        <button class="add-cart">Add to Cart</button>
                    </div> 


                    <button class="notify-btn"
                            data-product-id="${product.product_id }"
                            onclick="showStockAlert(event, ${product.product_id}, '${product.name}')"
                            style="display: none;">
                        <i class="fa-regular fa-bell"></i> Notify when available
                    </button>

                    <a href="/customer/home/product/${product.product_id}/"
                        onclick="productViewed(${product.product_id})">
                        <button class="product-details">View Product Details</button>
                    </a>
                
                    
                    
                    `;
            

            data.appendChild(card);

            const plusBtn = card.querySelector('.plus');
            if (plusBtn) {
                plusBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const display = card.querySelector('.quantity-display');
                    const maxStock = parseInt(card.dataset.maxStock);
                    const productId = card.dataset.productId;
                    if (display) {
                        const currentQty = parseInt(display.textContent);
                    if (currentQty < maxStock) {
                        display.textContent = currentQty + 1;
                        // Update notify button after quantity changes
                        updateNotifyButton(card, productId);
                    } else {
                        showNotification(`Only ${maxStock} items available in stock`, 'error');
                    }
                    }
                });

            }
            
            
            const minusBtn = card.querySelector('.minus');
            if (minusBtn) {
                minusBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const display = card.querySelector('.quantity-display');
                    const productId = card.dataset.productId;
                    if (display) {
                        let currentQty = parseInt(display.textContent);
                        if (currentQty > 1){
                            display.textContent = currentQty - 1;
                            // Update notify button after quantity decreases
                            updateNotifyButton(card, productId);
                        }
                    }
                });

            }
            
            
            const addToCartBtn = card.querySelector('.add-cart');
            if (addToCartBtn) {
                addToCartBtn.addEventListener('click', function(e) {
                    e.preventDefault();
                    const productId = card.dataset.productId;
                    const viewed = sessionStorage.getItem(`viewed_${productId}`);
                    if (!viewed){
                        showNotification("Please read allergen info before adding to cart", "error");
                        return;
                    }
                    if (!productId) {
                        showNotification('Error: Product ID not found', 'error');
                        return;
                    }
                    const quantityDisplay = card.querySelector('.quantity-display');
                    const quantity = quantityDisplay ? parseInt(quantityDisplay.textContent) : 1;
                    addToCart(productId, quantity, this);
                });
            }
        });
        

    }


    document.addEventListener('DOMContentLoaded', async function(){
        
        const productsContainer = document.querySelector(".product-container");

        async function loadCategoryProducts(query=""){
            try{
                const response = await fetchWithAuth(`/customer/home/api/category/${categoryName}/products/`);
                const data = await response.json();
                if (data.products && data.products.length > 0){
                    getProducts(data.products);
                } else {
                    productsContainer.innerHTML = "<p>No products available in this category</p>";

                }
            } catch (err){
                console.error(err);
                productsContainer.innerHTML = "<p>Error loading products<p>";
            }
        }

        loadCategoryProducts();
    })
    

    

    function updateCartBadge(count) {
        const badge = document.getElementById('cart-badge');
        if (badge) {
            badge.textContent = count;
            badge.style.display = count > 0 ? 'flex' : 'none';
        }
    }

    async function addToCart(productId, quantity, button) {
        if (button) {
            button.textContent = 'Adding...';
            button.disabled = true;
        }

        try {
            const response = await fetchWithAuth('/cart/api/add/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    product_id: parseInt(productId),
                    quantity: quantity
                })
            });

            const data = await response.json();

            if (data.success) {
                showNotification(data.message, 'success');
                updateCartBadge(data.cart_total_items);
                const display = button?.closest('.product-card')?.querySelector('.quantity-display');
                if (display) display.textContent = '1';
            } else {
                showNotification(data.error || 'Could not add to cart', 'error');
            }
        } catch (e) {
            if (e.message !== 'Session expired') showNotification('Something went wrong', 'error');
        } finally {
            if (button) {
                button.textContent = 'Add to Cart';
                button.disabled = false;
            }
        }
    }

    async function checkProductAvailability(productId) {
        const token = getToken();
        if (!token) return { isAvailable: false, available: 0 };
        try {
            const response = await fetch(`/cart/api/check-availability/${productId}/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            return {
                isAvailable: data.is_available_to_user,
                available: data.available
            };
        } catch (error) {
            console.error('Error checking availability:', error);
            return { isAvailable: false, available: 0 };
        }
    }

    async function updateNotifyButton(card, productId) {
        const token = getToken();
        if (!token) return;
        
        try {
            const quantityDisplay = card.querySelector('.quantity-display');
            const desiredQty = quantityDisplay ? parseInt(quantityDisplay.textContent) : 1;
            
            // Call the real-time availability API
            const response = await fetch(`/cart/api/check-availability/${productId}/`, {
                headers: { 'Authorization': `Bearer ${token}` }
            });
            const data = await response.json();
            const available = data.available ?? 0;
            
            const notifyBtn = card.querySelector('.notify-btn');
            if (notifyBtn) {
                if (desiredQty > available) {
                    notifyBtn.style.display = 'block';
                    notifyBtn.setAttribute('data-desired-qty', desiredQty);
                } else {
                    notifyBtn.style.display = 'none';
                }
            }
        } catch (error) {
            console.error('Error updating notify button:', error);
        }
    }

    // Stock Alert Modal Variables
    let currentProductId = null;
    let currentProductName = '';

    function showStockAlert(event, productId, productName) {
        currentProductId = productId;
        currentProductName = productName;
        
        // Get the quantity from the product card
        const card = event?.target?.closest('.product-card');
        const quantityDisplay = card?.querySelector('.quantity-display');
        const desiredQty = quantityDisplay ? parseInt(quantityDisplay.textContent) : 1;
        const maxStock = parseInt(card?.dataset.maxStock) || 99; // Get total stock
        
        // Store max stock in a data attribute or variable
        document.getElementById('alert-quantity').max = maxStock;
        document.getElementById('alert-quantity').dataset.maxStock = maxStock;
        document.getElementById('modal-product-name').innerHTML = 
            `How many ${productName} would you like to be notified about?<br>
            <small style="color:#666;">Current total stock: ${maxStock}</small>`;

        document.getElementById('alert-quantity').value = Math.min(desiredQty, maxStock);
        document.getElementById('stockAlertModal').style.display = 'flex';
    }

    function closeStockAlertModal() {
        document.getElementById('stockAlertModal').style.display = 'none';
    }

    function incrementAlertQuantity() {
        const input = document.getElementById('alert-quantity');
        const maxStock = parseInt(input.dataset.maxStock) || 99;
        let value = parseInt(input.value) || 1;
        if (value < maxStock) {
            input.value = value + 1;
        }
    }

    function decrementAlertQuantity() {
        const input = document.getElementById('alert-quantity');
        let value = parseInt(input.value) || 1;
        if (value > 1) {
            input.value = value - 1;
        }
    }

    function confirmStockAlert() {
        const quantity = parseInt(document.getElementById('alert-quantity').value);
        closeStockAlertModal();
        if (isNaN(quantity) || quantity < 1) {
            showNotification('Please enter a valid quantity', 'error');
            return;
        }
        createStockAlert(currentProductId, quantity, currentProductName);
    }

    window.onclick = function(event) {
        const modal = document.getElementById('stockAlertModal');
        if (event.target === modal) closeStockAlertModal();
    }


    async function createStockAlert(productId, quantity, productName) {
        const token = getToken();
        if (!token) { window.location.href = "/login/"; return; }
        try {
            const response = await fetchWithAuth('/notifications/api/alerts/create/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ product_id: productId, quantity: quantity })
            });
            const data = await response.json();
            if (data.success) {
                showNotification(` You'll be notified when ${productName} is available`, 'success');
            } else {
                showNotification('Error: ' + (data.error || 'Could not create alert'), 'error');
            }
        } catch (error) {
            showNotification('Something went wrong', 'error');
        }
    }

    document.addEventListener('DOMContentLoaded', function() {

        // Load cart badge count
        fetchWithAuth('/cart/api/icon/')
            .then(r => r.json())
            .then(data => { if (data.total_items > 0) updateCartBadge(data.total_items); })
            .catch(err => console.error('Cart icon error:', err));
        
        // Setup each product card
        document.querySelectorAll('.product-card').forEach(card => {
            const maxStock = parseInt(card.dataset.maxStock);

            card.querySelector('.plus')?.addEventListener('click', function(e) {
                e.preventDefault();
                const display = card.querySelector('.quantity-display');
                const maxStock = parseInt(card.dataset.maxStock);
                const productId = card.dataset.productId;
                if (display) {
                    const currentQty = parseInt(display.textContent);
                    if (currentQty < maxStock) {
                        display.textContent = currentQty + 1;
                        // Update notify button after quantity changes
                        updateNotifyButton(card, productId);
                    } else {
                        showNotification(`Only ${maxStock} items available in stock`, 'error');
                    }
                }
            });

            /*
            card.querySelector('.minus')?.addEventListener('click', function(e) {
                e.preventDefault();
                const display = card.querySelector('.quantity-display');
                const productId = card.dataset.productId;
                if (display) {
                    const current = parseInt(display.textContent);
                    if (current > 1) {
                        display.textContent = current - 1;
                        // Update notify button after quantity changes
                        updateNotifyButton(card, productId);
                    }
                }
            });
        */

            
            card.querySelector('.add-cart')?.addEventListener('click', function(e) {
                e.preventDefault();
                const productId = card.dataset.productId;
                if (!productId) {
                    showNotification('Error: Product ID not found', 'error');
                    return;
                }
                const display = card.querySelector('.quantity-display');
                const quantity = display ? parseInt(display.textContent) : 1;
                addToCart(productId, quantity, this);
            });
        });
        
        

        // Update notify buttons based on real-time availability
        document.querySelectorAll('.product-card').forEach(async card => {
            const productId = card.dataset.productId;
            if (productId) await updateNotifyButton(card, productId);
        });
    });



    function logoutUser() {
        localStorage.clear();
        sessionStorage.clear();
        window.location.href = "/login/";
    }

    


</script>
