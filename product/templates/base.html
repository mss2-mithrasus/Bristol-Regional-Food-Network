
{% load static %}

<!DOCTYPE html>
<html lang = "en">
    <head>
        <meta charset="UTF-8">
        <title>Bristol Regional Food Network</title>
        <link rel="stylesheet" href="{% static 'base.css'%}">
        {% block head%}
        {%endblock%}
    </head>
    

    <body> 

        <header class="navbar">
            <div class="nav-left">
                <img src="{% static 'images/leaf.png' %}" alt="Leaf logo" class="logo">
                <span class="title">Bristol Regional Food Network</span>
            </div>
            {%block nav%}

            <nav class="nav-links">
                <!--we want the buttons styling to be active if we are on that page to make it clear what page the user is currently on
                which is what is being done here-->
                <a href="{%url 'home'%}"
                class="{%if request.resolver_match.url_name == 'home'%}active{%endif%}">Home</a>
                <a href="#">Login</a>
                {%block nav_extra%}{%endblock%}
            </nav>
            {%endblock%}
        </header>

        <!--page content will go here e.g login form-->
        <main>
            {% block content%}
            {%endblock%}
        </main>

        <footer class="footer">
            <p>Local Food Marketplace | Supporting Local Farmers</p>
        </footer>
        <script>
            (function() {
                const token = localStorage.getItem("access") || sessionStorage.getItem("access");
                if (!token) return;

                fetch('/cart/api/icon/', {
                    headers: { 'Authorization': 'Bearer ' + token }
                })
                .then(r => {
                    if (r.status === 401) {
                        // Try refresh
                        const refresh = localStorage.getItem("refresh") || sessionStorage.getItem("refresh");
                        if (!refresh) return null;
                        return fetch('/api/token/refresh/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ refresh })
                        })
                        .then(r => r.json())
                        .then(data => {
                            if (localStorage.getItem("access")) localStorage.setItem("access", data.access);
                            else sessionStorage.setItem("access", data.access);
                            return fetch('/cart/api/icon/', {
                                headers: { 'Authorization': 'Bearer ' + data.access }
                            });
                        });
                    }
                    return r;
                })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (data && data.total_items > 0) {
                        const badge = document.getElementById('cart-badge');
                        if (badge) {
                            badge.textContent = data.total_items;
                            badge.style.display = 'flex';
                        }
                    }
                })
                .catch(() => {});
            })();
        </script>
    </body>
    </html>
