
{% load static %}

<!DOCTYPE html>
<html lang = "en">
    <head>
        <!-- added font moved it from product.html to here -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

        <meta charset="UTF-8">
        <title>Bristol Regional Food Network</title>
        <link rel="stylesheet" href="{% static 'base.css'%}">
        {% block head%}
        {%endblock%}
    </head>
    
    

    <body> 
        {% include "header.html" %}



        <!--page content will go here e.g login form-->
        <main>
            {% block content%}
            {%endblock%}
        </main>

        <footer class="footer">
            <p>Local Food Marketplace | Supporting Local Farmers</p>
        </footer>
        <script>
            (function() {
                const token = localStorage.getItem("access") || sessionStorage.getItem("access");
                if (!token) return;

                fetch('/cart/api/icon/', {
                    headers: { 'Authorization': 'Bearer ' + token }
                })
                .then(r => {
                    if (r.status === 401) {
                        // Try refresh
                        const refresh = localStorage.getItem("refresh") || sessionStorage.getItem("refresh");
                        if (!refresh) return null;
                        return fetch('/api/token/refresh/', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ refresh })
                        })
                        .then(r => r.json())
                        .then(data => {
                            if (localStorage.getItem("access")) localStorage.setItem("access", data.access);
                            else sessionStorage.setItem("access", data.access);
                            return fetch('/cart/api/icon/', {
                                headers: { 'Authorization': 'Bearer ' + data.access }
                            });
                        });
                    }
                    return r;
                })
                .then(r => r ? r.json() : null)
                .then(data => {
                    if (data && data.total_items > 0) {
                        const badge = document.getElementById('cart-badge');
                        if (badge) {
                            badge.textContent = data.total_items;
                            badge.style.display = 'flex';
                        }
                    }
                })
                .catch(() => {});
            })();
        </script>
        {% block scripts %}
        {%endblock%}
    </body>
    
    </html>
