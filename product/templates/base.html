        <footer class="footer">

        <script>
            (function() {
                const token = localStorage.getItem("access") || sessionStorage.getItem("access");
                const notificationContainer = document.getElementById('notification-container');
                const notificationBadge = document.getElementById('notification-badge');
                
                if (token) {
                    // Show notification container
                    if (notificationContainer) {
                        notificationContainer.style.display = 'inline-block';
                    }
                    
                    // Function to check for unread notifications
                    async function checkNotifications() {
                        try {
                            const response = await fetch('/notifications/api/unread-count/', {
                                headers: { 'Authorization': 'Bearer ' + token }
                            });
                            
                            if (response.ok) {
                                const data = await response.json();
                                
                                if (notificationBadge) {
                                    if (data.unread_count > 0) {
                                        notificationBadge.textContent = data.unread_count;
                                        notificationBadge.style.display = 'flex';
                                        console.log(' Notification badge shown:', data.unread_count);
                                    } else {
                                        notificationBadge.style.display = 'none';
                                    }
                                }
                            }
                        } catch (error) {
                            console.error('Error checking notifications:', error);
                        }
                    }
                    
                    // Check immediately
                    checkNotifications();
                    
                    // Check every 2 seconds (more frequent for instant updates)
                    setInterval(checkNotifications, 2000);
                    
                    // Cart badge (your existing code)
                    fetch('/cart/api/icon/', {
                        headers: { 'Authorization': 'Bearer ' + token }
                    })
                    .then(r => {
                        if (r.status === 401) {
                            const refresh = localStorage.getItem("refresh") || sessionStorage.getItem("refresh");
                            if (!refresh) return null;
                            return fetch('/api/token/refresh/', {
                                method: 'POST',
                                headers: { 'Content-Type': 'application/json' },
                                body: JSON.stringify({ refresh })
                            })
                            .then(r => r.json())
                            .then(data => {
                                if (localStorage.getItem("access")) localStorage.setItem("access", data.access);
                                else sessionStorage.setItem("access", data.access);
                                return fetch('/cart/api/icon/', {
                                    headers: { 'Authorization': 'Bearer ' + data.access }
                                });
                            });
                        }
                        return r;
                    })
                    .then(r => r ? r.json() : null)
                    .then(data => {
                        if (data && data.total_items > 0) {
                            const badge = document.getElementById('cart-badge');
                            if (badge) {
                                badge.textContent = data.total_items;
                                badge.style.display = 'flex';
                            }
                        }
                    })
                    .catch(() => {});
                }
            })();
        </script>
        {% block scripts %}
        {% endblock%}
    </body>
